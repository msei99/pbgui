---
# Update pbgui on localhost
# Steps:
# 1. Clone/update pbgui repository
# 2. If updated, install requirements, sync systemd units and restart PBCluster/PBData/PBCoinData/PBMonitorAgent

- hosts: "{{ target_hosts | default('localhost') }}"
  gather_facts: "{{ debug }}"
  force_handlers: true

  vars:
    pbgdir: "{{ pbgdir }}"

  tasks:
    - name: display facts
      debug:
        var: ansible_facts
      tags: debug,never

    - name: Get current branch
      command: git rev-parse --abbrev-ref HEAD
      args:
        chdir: "{{ pbgdir }}"
      register: current_branch
      changed_when: false
      when: pbgdir != ""

    - name: clone pbgui repository
      git:
        repo: https://github.com/msei99/pbgui.git
        dest: "{{ pbgdir }}"
        version: "{{ current_branch.stdout }}"
        refspec: "+refs/heads/{{ current_branch.stdout }}:refs/remotes/origin/{{ current_branch.stdout }}"
        update: yes
        force: yes
      when: pbgdir != ""
      register: pbgui_repo

    - name: Reconcile pbgui requirements
      command:
        argv:
          - "{{ pbgui_python | default(ansible_playbook_python) }}"
          - -m
          - pip
          - install
          - --upgrade
          - pip
          - -r
          - "{{ pbgdir }}/requirements.txt"
      when: pbgdir != ""
      register: pbgui_requirements
      changed_when: "'Successfully installed' in ((pbgui_requirements.stdout | default('')) + (pbgui_requirements.stderr | default('')))"

    - name: Migrate missing legacy master role
      command:
        argv:
          - "{{ pbgui_python | default(ansible_playbook_python) }}"
          - -c
          - "from pbgui_purefunc import load_ini, save_ini; role=load_ini('main', 'role').strip(); changed=not role; save_ini('main', 'role', 'master') if changed else None; print('changed=' + str(changed).lower())"
      args:
        chdir: "{{ pbgdir }}"
      when: pbgdir != ""
      register: legacy_master_role
      changed_when: "'changed=true' in (legacy_master_role.stdout | default(''))"

    - name: Schedule PBGui restart after successful update
      command: /bin/true
      when: pbgdir != ""
      changed_when: (pbgui_repo.changed | default(false)) or (pbgui_requirements.changed | default(false))
      notify: restart pbgui

    - name: Reconcile PBGui systemd user services
      command:
        argv:
          - /bin/bash
          - "{{ pbgdir }}/setup/setup_systemd.sh"
          - --pbgui-dir
          - "{{ pbgdir }}"
          - --python
          - "{{ pbgui_python | default(ansible_playbook_python) }}"
          - --preserve-state
      when: pbgdir != ""
      register: systemd_reconcile_result
      changed_when: "'changed=true' in (systemd_reconcile_result.stdout | default(''))"

    - name: Check whether monitor-agent was active
      command:
        argv:
          - systemctl
          - --user
          - is-active
          - --quiet
          - pbgui-monitor-agent.service
      when: pbgdir != ""
      register: monitor_agent_before
      changed_when: false
      failed_when: false

    - name: Check whether persistent VPS Monitor was active
      command:
        argv:
          - systemctl
          - --user
          - is-active
          - --quiet
          - pbgui-vps-monitor.service
      when: pbgdir != ""
      register: vps_monitor_before
      changed_when: false
      failed_when: false

    - name: Check whether PBApiServer was active
      command:
        argv:
          - systemctl
          - --user
          - is-active
          - --quiet
          - pbgui-api.service
      when: pbgdir != ""
      register: api_server_before
      changed_when: false
      failed_when: false

    - name: Recover and verify monitor-agent without touching PBApiServer
      script: setup/vps_service_control.sh start PBMonitorAgent
      environment:
        PBGUI_DIR: "{{ pbgdir }}"
        PBGUI_PYTHON: "{{ pbgui_python | default(ansible_playbook_python) }}"
      when: pbgdir != "" and monitor_agent_before.rc == 0
      register: monitor_agent_recovery
      changed_when: false

    - name: print pbgui_repo
      debug:
        var: pbgui_repo
      tags: debug,never

  handlers:
    - name: Sync PBGui systemd user services
      command:
        argv:
          - /bin/bash
          - "{{ pbgdir }}/setup/setup_systemd.sh"
          - --pbgui-dir
          - "{{ pbgdir }}"
          - --python
          - "{{ pbgui_python | default(ansible_playbook_python) }}"
          - --preserve-state
      register: systemd_setup_result
      changed_when: "'changed=true' in (systemd_setup_result.stdout | default(''))"
      listen: "restart pbgui"

    - name: Restart PBCluster, PBData, PBCoinData and PBMonitorAgent
      script: setup/vps_service_control.sh restart PBCluster PBData PBCoinData PBMonitorAgent
      environment:
        PBGUI_DIR: "{{ pbgdir }}"
        PBGUI_PYTHON: "{{ pbgui_python | default(ansible_playbook_python) }}"
        PBGUI_REQUIRE_PBCOINDATA: "1"
        PBGUI_RESTART_ACTIVE_ONLY: "1"
      listen: "restart pbgui"

    - name: Restart PBApiServer
      shell: |
        set -euo pipefail
        update_pid="$$"
        ancestor="$$"
        while [ "$ancestor" -gt 1 ]; do
          process_name="$(ps -o comm= -p "$ancestor" | tr -d ' ')"
          case "$process_name" in
            ansible-playboo*) update_pid="$ancestor" ;;
          esac
          parent="$(ps -o ppid= -p "$ancestor" | tr -d ' ')"
          [ -n "$parent" ] || break
          ancestor="$parent"
        done
        read -r -a update_stat < "/proc/$update_pid/stat"
        update_start="${update_stat[21]}"
        restart_unit="pbgui-api-restart-$(date +%s%N)"
        systemd-run --user --unit="$restart_unit" --collect --setenv=PBGUI_DIR="$PBGUI_DIR" --setenv=PBGUI_PYTHON="$PBGUI_PYTHON" --setenv=PBGUI_UPDATE_PID="$update_pid" --setenv=PBGUI_UPDATE_START="$update_start" --setenv=PBGUI_VPS_MONITOR_WAS_ACTIVE="$PBGUI_VPS_MONITOR_WAS_ACTIVE" /bin/bash -c '
          while [ -r "/proc/$PBGUI_UPDATE_PID/stat" ]; do
            read -r -a current_stat < "/proc/$PBGUI_UPDATE_PID/stat" || break
            [ "${current_stat[21]}" = "$PBGUI_UPDATE_START" ] || break
            sleep 1
          done
          cd "$PBGUI_DIR"
          systemctl --user stop pbgui-api.service >/dev/null 2>&1 || true
          /bin/bash "$PBGUI_DIR/setup/stop_legacy_api.sh" --pbgui-dir "$PBGUI_DIR"
          if [ "$PBGUI_VPS_MONITOR_WAS_ACTIVE" = "1" ]; then
            systemctl --user restart pbgui-vps-monitor.service
            monitor_ready=0
            for _ in $(seq 1 30); do
              if "$PBGUI_PYTHON" -c "from master.vps_monitor_client import VPSMonitorRPCClient; VPSMonitorRPCClient(timeout=1).call(\"hello\")"; then
                monitor_ready=1
                break
              fi
              sleep 1
            done
            if [ "$monitor_ready" != 1 ]; then
              systemctl --user status pbgui-vps-monitor.service --no-pager -l
              exit 1
            fi
          fi
          if ! systemctl --user start pbgui-api.service; then
            systemctl --user show pbgui-api.service --no-pager --property=ActiveState,SubState,Result,ExecMainStatus,NRestarts
            systemctl --user status pbgui-api.service --no-pager -l
            exit 1
          fi
          baseline="$(systemctl --user show pbgui-api.service --property=NRestarts --value)"
          case "$baseline" in ""|*[!0-9]*) baseline=0 ;; esac
          sleep 12
          active="$(systemctl --user show pbgui-api.service --property=ActiveState --value)"
          sub="$(systemctl --user show pbgui-api.service --property=SubState --value)"
          result="$(systemctl --user show pbgui-api.service --property=Result --value)"
          status="$(systemctl --user show pbgui-api.service --property=ExecMainStatus --value)"
          after="$(systemctl --user show pbgui-api.service --property=NRestarts --value)"
          case "$after" in ""|*[!0-9]*) after=0 ;; esac
          if [ "$active" != active ] || [ "$sub" != running ] || [ "$result" != success ] || [ "${status:-0}" != 0 ] || [ "$after" -gt "$baseline" ]; then
            systemctl --user show pbgui-api.service --no-pager --property=ActiveState,SubState,Result,ExecMainStatus,NRestarts
            systemctl --user status pbgui-api.service --no-pager -l
            exit 1
          fi
        '
      args:
        executable: /bin/bash
      environment:
        PBGUI_DIR: "{{ pbgdir }}"
        PBGUI_PYTHON: "{{ pbgui_python | default(ansible_playbook_python) }}"
        PBGUI_VPS_MONITOR_WAS_ACTIVE: "{{ '1' if (vps_monitor_before.rc | default(1)) == 0 else '0' }}"
      changed_when: true
      listen: "restart pbgui"
      when: (api_server_before.rc | default(1)) == 0
