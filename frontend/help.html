<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PBGui — Help & Tutorials</title>
  <script src="./vendor/marked.min.js?v=1"></script>
  <script src="./vendor/purify.min.js?v=1"></script>
  <link rel="stylesheet" href="./css/sidebar.css?v=6">
  <style>
    :root {
      --fs-xs: 11px;
      --fs-sm: 13px;
      --fs-base: 14px;
      --fs-md: 15px;
      --fs-lg: 18px;
      --fs-xl: 22px;
      --sp-xs: 4px;
      --sp-sm: 8px;
      --sp-md: 12px;
      --sp-lg: 20px;
      --input-h: 32px;
      --btn-h: 32px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      width: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: var(--fs-base);
      background: #0e1117;
      color: #e2e8f0;
      overflow: hidden;
    }

    #page-body { display:flex; height:calc(100vh - 52px); overflow:hidden; }
    #main-content { display:flex; flex-direction:column; flex:1; min-width:0; min-height:0; overflow:hidden; }
    #help-toc-list { display:flex; flex-direction:column; gap:4px; }
    .help-toolbar { display:flex; align-items:center; flex-wrap:wrap; gap:12px; padding:12px 20px; border-bottom:1px solid #2d3748; flex-shrink:0; }
    .help-toolbar h1 { font-size:18px; margin-right:auto; }
    #help-search-wrap { flex-wrap:wrap; }
    #help-content {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem 1.8rem;
      line-height: 1.7;
      color: #cbd5e0;
      font-size: var(--fs-base);
    }

    #help-content h1 {
      font-size: var(--fs-xl);
      color: #e2e8f0;
      margin: 0 0 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid #1e2736;
    }

    #help-content h2 {
      font-size: var(--fs-lg);
      color: #e2e8f0;
      margin: 1.5rem 0 0.5rem;
    }

    #help-content h3 {
      font-size: var(--fs-md);
      color: #cbd5e0;
      margin: 1.1rem 0 0.35rem;
    }

    #help-content p { margin: 0.5rem 0; }
    #help-content a { color: #63b3ed; text-decoration: none; }
    #help-content a:hover { text-decoration: underline; }
    #help-content strong { color: #e2e8f0; }
    #help-content em { color: #94a3b8; font-style: italic; }
    #help-content code {
      background: #1a202c;
      color: #f6ad55;
      padding: 0.1em 0.35em;
      border-radius: 3px;
      font-size: var(--fs-xs);
      font-family: 'Fira Code', 'Consolas', monospace;
    }

    #help-content pre {
      background: #0e1117;
      border: 1px solid #2d3748;
      border-radius: 6px;
      padding: 0.9rem 1rem;
      overflow-x: auto;
      margin: 0.75rem 0;
    }

    #help-content pre code {
      background: none;
      padding: 0;
      color: #a0aec0;
      font-size: var(--fs-sm);
    }

    #help-content ul,
    #help-content ol {
      padding-left: 1.5rem;
      margin: 0.5rem 0;
    }

    #help-content li { margin: 0.2rem 0; }

    #help-content blockquote {
      border-left: 3px solid #63b3ed;
      margin: 0.75rem 0;
      padding: 0.4rem 0.9rem;
      background: rgba(99, 179, 237, 0.05);
      border-radius: 0 5px 5px 0;
      color: #94a3b8;
    }

    #help-content table {
      border-collapse: collapse;
      width: 100%;
      margin: 0.75rem 0;
    }

    #help-content th,
    #help-content td {
      border: 1px solid #2d3748;
      padding: 0.4rem 0.7rem;
      text-align: left;
      font-size: var(--fs-sm);
      vertical-align: top;
    }

    #help-content th {
      background: #1a202c;
      color: #e2e8f0;
      font-weight: 600;
    }

    #help-content hr {
      border: none;
      border-top: 1px solid #1e2736;
      margin: 1rem 0;
    }

    #help-content img {
      max-width: 100%;
      border-radius: 6px;
      margin: 0.5rem 0;
    }

    .help-loading {
      color: #4a5568;
      font-style: italic;
      padding: 2rem;
      text-align: center;
    }

    #help-search-wrap {
      display: flex;
      align-items: center;
      gap: 3px;
    }

    #help-search {
      background: #1a202c;
      color: #e2e8f0;
      border: 1px solid #2d3748;
      border-radius: 5px;
      padding: 0.28rem 0.5rem;
      font-size: var(--fs-sm);
      outline: none;
      width: 170px;
    }

    #help-search:focus { border-color: #4a5568; }
    #help-search::placeholder { color: #4a5568; }

    .help-snav-btn {
      background: #1a202c;
      border: 1px solid #2d3748;
      border-radius: 3px;
      color: #94a3b8;
      cursor: pointer;
      font-size: var(--fs-xs);
      padding: 2px 5px;
      line-height: 1.4;
      transition: color 0.1s, border-color 0.1s;
    }

    .help-snav-btn:hover {
      color: #e2e8f0;
      border-color: #4a5568;
    }

    #help-search-count {
      font-size: var(--fs-xs);
      color: #64748b;
      white-space: nowrap;
      min-width: 44px;
      text-align: left;
    }

    #help-content mark {
      background: rgba(255, 200, 0, 0.2);
      color: #fcd34d;
      border-radius: 2px;
    }

    #help-content mark.current {
      background: rgba(251, 146, 60, 0.45);
      color: #fef08a;
      outline: 1px solid #f59e0b;
    }

    #help-search-global-lbl {
      display: flex;
      align-items: center;
      gap: 3px;
      color: #94a3b8;
      font-size: var(--fs-xs);
      cursor: pointer;
      white-space: nowrap;
      user-select: none;
    }

    #help-search-global-lbl input[type="checkbox"] {
      accent-color: #4da6ff;
      cursor: pointer;
      margin: 0;
    }

    .gs-results {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 4px 0;
    }

    .gs-item {
      background: #1a202c;
      border: 1px solid #2d3748;
      border-radius: 6px;
      padding: 10px 14px;
      cursor: pointer;
      transition: border-color 0.15s;
    }

    .gs-item:hover { border-color: #4a5568; }

    .gs-topic {
      color: #93c5fd;
      font-weight: 600;
      font-size: var(--fs-sm);
      margin-bottom: 5px;
    }

    .gs-snip {
      color: #94a3b8;
      font-size: var(--fs-xs);
      line-height: 1.55;
      overflow: hidden;
      text-overflow: ellipsis;
    }

  </style>
  <link rel="stylesheet" href="./css/sidebar_layout.css?v=4">
  <script src="./js/sidebar_resize.js?v=3"></script>
</head>
<body>
  <nav id="topnav"></nav>

  <div id="page-body">
    <aside id="sidebar" aria-label="Help topics">
      <div id="sidebar-sticky">
        <div id="sidebar-header"><span class="sb-title">Help &amp; Tutorials</span></div>
        <div id="sidebar-toolbar">
          <div class="sb-icon-row" role="group" aria-label="Help language">
            <button id="help-lang-en" class="sb-btn active">EN</button>
            <button id="help-lang-de" class="sb-btn">DE</button>
          </div>
          <label class="sb-label" for="help-toc-filter">Topics</label>
          <input id="help-toc-filter" class="sb-input" type="search" placeholder="Filter topics..." autocomplete="off">
        </div>
      </div>
      <div id="sidebar-inner"><div id="help-toc-list"></div></div>
      <div id="sidebar-resize"></div>
    </aside>
    <main id="main-content">
      <header class="help-toolbar">
        <h1>Guide &amp; Help</h1>
        <div id="help-search-wrap">
          <input id="help-search" type="search" placeholder="Search in topic..." aria-label="Search help" autocomplete="off">
          <button class="help-snav-btn" id="help-search-up" title="Previous match (Shift+Enter)">&#9650;</button>
          <button class="help-snav-btn" id="help-search-dn" title="Next match (Enter)">&#9660;</button>
          <span id="help-search-count"></span>
          <label id="help-search-global-lbl"><input type="checkbox" id="help-search-global"> All topics</label>
        </div>
      </header>
      <div id="help-content"><div class="help-loading">Loading help topics...</div></div>
    </main>
  </div>

  <script>
    var _query = new URLSearchParams(window.location.search);
    var API_BASE = '%%API_BASE%%';
    var WS_BASE = '%%WS_BASE%%';
    var PBGUI_VERSION = '%%VERSION%%';
    var PBGUI_SERIAL = '%%SERIAL%%';
    var TOPIC = _query.get('topic') || '';
    var APP_PREFIX = (function () {
      var marker = window.location.pathname.lastIndexOf('/app/');
      return marker >= 0 ? window.location.pathname.slice(0, marker) : '';
    }());
    function appPath(path) {
      return APP_PREFIX + path;
    }
    function hasInjectedPlaceholder(value) {
      return typeof value === 'string' && value.indexOf('%%') !== -1;
    }

    function syncNavMeta() {
      if (!window.PBGUI_NAV_CONFIG) return;
      window.PBGUI_NAV_CONFIG.version = PBGUI_VERSION;
      window.PBGUI_NAV_CONFIG.serial = PBGUI_SERIAL;
    }

    function syncAboutMeta() {
      var aboutVer = document.getElementById('pbgui-about-ver');
      if (aboutVer) {
        aboutVer.textContent = 'PBGui ' + PBGUI_VERSION;
      }

      var aboutSerial = document.getElementById('pbgui-about-serial');
      if (!PBGUI_SERIAL) {
        if (aboutSerial && aboutSerial.parentNode) {
          aboutSerial.parentNode.removeChild(aboutSerial);
        }
        return;
      }

      if (!aboutSerial) {
        var aboutTag = document.getElementById('pbgui-about-tag');
        if (aboutTag && aboutTag.parentNode) {
          aboutSerial = document.createElement('div');
          aboutSerial.id = 'pbgui-about-serial';
          aboutTag.parentNode.insertBefore(aboutSerial, aboutTag);
        }
      }
      if (aboutSerial) {
        aboutSerial.textContent = 'API Serial ' + PBGUI_SERIAL;
      }
    }

    async function ensurePageMeta() {
      if (!hasInjectedPlaceholder(PBGUI_VERSION) && !hasInjectedPlaceholder(PBGUI_SERIAL)) return;
      try {
        var response = await fetch(appPath('/api/help/meta'), { cache: 'no-store', credentials: 'same-origin' });
        if (!response.ok) return;

        var data = await response.json();
        PBGUI_VERSION = String(data.version || '');
        PBGUI_SERIAL = String(data.serial || '');
        window.PBGUI_VERSION = PBGUI_VERSION;
        window.PBGUI_SERIAL = PBGUI_SERIAL;
        syncNavMeta();
        syncAboutMeta();
      } catch (error) {
        console.warn('Failed to load Help page version metadata', error);
      }
    }

    marked.setOptions({ gfm: true, breaks: true });

    (function () {
      var helpContent = document.getElementById('help-content');
      var helpTocList = document.getElementById('help-toc-list');
      var helpFilter = document.getElementById('help-toc-filter');
      var helpLangEN = document.getElementById('help-lang-en');
      var helpLangDE = document.getElementById('help-lang-de');

      var helpLang = _query.get('lang') || localStorage.getItem('help-lang') || 'EN';
      helpLang = helpLang === 'DE' ? 'DE' : 'EN';
      helpFilter.value = _query.get('filter') || '';
      var helpTopics = [];
      var helpSel = 0;
      var helpLoaded = false;
      var topicCache = {};
      var topicLoadGeneration = 0;
      var helpIndexGeneration = 0;

      var helpSearch = document.getElementById('help-search');
      var helpSearchUp = document.getElementById('help-search-up');
      var helpSearchDn = document.getElementById('help-search-dn');
      var helpSearchCount = document.getElementById('help-search-count');
      var helpSearchGlobal = document.getElementById('help-search-global');
      var searchMarks = [];
      var searchIndex = -1;
      var searchTimer = null;
      var rawHtml = null;
      var globalMode = _query.get('all') === '1';
      helpSearch.value = _query.get('q') || '';
      helpSearchGlobal.checked = globalMode;
      helpSearch.placeholder = globalMode ? 'Search all topics...' : 'Search in topic...';

      function setLanguageButtons() {
        helpLangEN.classList.toggle('active', helpLang === 'EN');
        helpLangDE.classList.toggle('active', helpLang === 'DE');
        helpLangEN.setAttribute('aria-pressed', String(helpLang === 'EN'));
        helpLangDE.setAttribute('aria-pressed', String(helpLang === 'DE'));
      }

      function renderMarkdown(md) {
        var sanitized = DOMPurify.sanitize(marked.parse(String(md || '')), {
          USE_PROFILES: { html: true }
        });
        var template = document.createElement('template');
        template.innerHTML = sanitized;
        Array.from(template.content.querySelectorAll('a[href],img[src]')).forEach(function (element) {
          var attribute = element.tagName === 'A' ? 'href' : 'src';
          if (!isSafeHelpUrl(element.getAttribute(attribute))) element.removeAttribute(attribute);
          if (element.tagName === 'A' && element.getAttribute('target') === '_blank') {
            element.setAttribute('rel', 'noopener noreferrer');
          }
        });
        return template.innerHTML;
      }

      function isSafeHelpUrl(rawUrl) {
        try {
          var parsed = new URL(String(rawUrl || '').trim(), window.location.origin);
          return parsed.protocol === 'http:' || parsed.protocol === 'https:';
        } catch (error) {
          return false;
        }
      }

      function stripHtml(html) {
        var template = document.createElement('template');
        template.innerHTML = DOMPurify.sanitize(String(html || ''), { USE_PROFILES: { html: true } });
        return String(template.content.textContent || '').replace(/\s+/g, ' ').trim();
      }

      function escapeRegExp(value) {
        return String(value || '').replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      }

      function appendHighlighted(parent, text, expr) {
        var value = String(text || '');
        var offset = 0;
        var match;
        expr.lastIndex = 0;
        while ((match = expr.exec(value)) !== null) {
          parent.appendChild(document.createTextNode(value.slice(offset, match.index)));
          var mark = document.createElement('mark');
          mark.textContent = match[0];
          parent.appendChild(mark);
          offset = match.index + match[0].length;
          if (!match[0].length) expr.lastIndex += 1;
        }
        parent.appendChild(document.createTextNode(value.slice(offset)));
      }

      function clearSearch() {
        if (rawHtml !== null) {
          var scrollTop = helpContent.scrollTop;
          helpContent.innerHTML = rawHtml;
          helpContent.scrollTop = scrollTop;
        }
        searchMarks = [];
        searchIndex = -1;
        helpSearchCount.textContent = '';
      }

      function updateSearchCount() {
        helpSearchCount.textContent = searchMarks.length
          ? (searchIndex + 1) + '/' + searchMarks.length
          : (helpSearch.value.trim() ? '0 found' : '');
      }

      function gotoMark(index) {
        if (!searchMarks.length) return;
        if (searchIndex >= 0 && searchIndex < searchMarks.length) {
          searchMarks[searchIndex].classList.remove('current');
        }
        searchIndex = ((index % searchMarks.length) + searchMarks.length) % searchMarks.length;
        searchMarks[searchIndex].classList.add('current');
        searchMarks[searchIndex].scrollIntoView({ block: 'center', behavior: 'smooth' });
        updateSearchCount();
      }

      function applySearch(term) {
        if (rawHtml === null) return;
        if (!term) {
          clearSearch();
          return;
        }
        var expr;
        try {
          expr = new RegExp('(' + escapeRegExp(term) + ')', 'gi');
        } catch (error) {
          return;
        }
        helpContent.innerHTML = rawHtml;
        var walker = document.createTreeWalker(helpContent, NodeFilter.SHOW_TEXT);
        var textNodes = [];
        var node;
        while ((node = walker.nextNode())) textNodes.push(node);
        textNodes.forEach(function (textNode) {
          expr.lastIndex = 0;
          if (!expr.test(textNode.nodeValue || '')) return;
          var fragment = document.createDocumentFragment();
          appendHighlighted(fragment, textNode.nodeValue || '', expr);
          textNode.parentNode.replaceChild(fragment, textNode);
        });
        searchMarks = Array.from(helpContent.querySelectorAll('mark'));
        updateSearchCount();
        if (searchMarks.length) gotoMark(0);
      }

      function ensureTopicCached(index, callback) {
        var generation = helpIndexGeneration;
        var language = helpLang;
        if (topicCache[index] !== undefined) {
          callback(topicCache[index]);
          return;
        }
        var topic = helpTopics[index];
        if (!topic) {
          callback('');
          return;
        }
        fetch(appPath('/api/help/content?file=') + encodeURIComponent(topic.file) + '&lang=' + language, { credentials: 'same-origin' })
          .then(function (response) {
            if (!response.ok) throw new Error('HTTP ' + response.status);
            return response.json();
          })
          .then(function (data) {
            if (generation !== helpIndexGeneration || language !== helpLang) return;
            topicCache[index] = renderMarkdown(data.content || '');
            callback(topicCache[index]);
          })
          .catch(function () {
            if (generation !== helpIndexGeneration || language !== helpLang) return;
            topicCache[index] = '';
            callback('');
          });
      }

      function renderGlobalResults(term, results) {
        var expr;
        try {
          expr = new RegExp('(' + escapeRegExp(term) + ')', 'gi');
        } catch (error) {
          return;
        }
        if (!results.length) {
          helpContent.innerHTML = '<p style="color:#64748b;padding:8px 0;">No results found.</p>';
          helpSearchCount.textContent = '0 found';
          return;
        }
        helpSearchCount.textContent = results.length + (results.length === 1 ? ' topic' : ' topics');
        var container = document.createElement('div');
        container.className = 'gs-results';
        results.forEach(function (result) {
          var item = document.createElement('div');
          item.className = 'gs-item';
          item.dataset.idx = String(result.idx);
          var title = document.createElement('div');
          title.className = 'gs-topic';
          title.textContent = String(result.title || '');
          item.appendChild(title);
          result.snippets.forEach(function (snippet) {
            var snippetElement = document.createElement('div');
            snippetElement.className = 'gs-snip';
            appendHighlighted(snippetElement, '...' + snippet + '...', expr);
            item.appendChild(snippetElement);
          });
          item.addEventListener('click', function () {
            var idx = parseInt(item.dataset.idx, 10);
            helpSearchGlobal.checked = false;
            globalMode = false;
            helpSearch.placeholder = 'Search in topic...';
            loadTopic(idx);
          });
          container.appendChild(item);
        });
        helpContent.replaceChildren(container);
      }

      function showGlobalResults(term) {
        var generation = ++topicLoadGeneration;
        var language = helpLang;
        if (!term) {
          helpContent.innerHTML = '<p style="color:#64748b;padding:8px 0;">Type a search term to find across all topics.</p>';
          helpSearchCount.textContent = '';
          return;
        }
        var expr;
        try {
          expr = new RegExp(escapeRegExp(term), 'gi');
        } catch (error) {
          return;
        }
        helpContent.innerHTML = '<div class="help-loading">Searching...</div>';
        var pending = helpTopics.length;
        var results = [];
        if (!pending) {
          helpContent.innerHTML = '<p style="color:#64748b;padding:8px 0;">No results found.</p>';
          return;
        }
        helpTopics.forEach(function (topic, index) {
          ensureTopicCached(index, function (html) {
            if (generation !== topicLoadGeneration || language !== helpLang) return;
            var text = stripHtml(html);
            var matches = [];
            var match;
            expr.lastIndex = 0;
            while ((match = expr.exec(text)) !== null) {
              matches.push(match.index);
              if (matches.length >= 3) break;
            }
            if (matches.length) {
              results.push({
                idx: index,
                title: topic.title,
                snippets: matches.map(function (position) {
                  return text.slice(Math.max(0, position - 55), Math.min(text.length, position + 80));
                })
              });
            }
            pending -= 1;
            if (!pending) renderGlobalResults(term, results);
          });
        });
      }

      function renderToc() {
        var filter = helpFilter.value.trim().toLowerCase();
        helpTocList.innerHTML = '';
        helpTopics.forEach(function (topic, index) {
          if (filter && topic.title.toLowerCase().indexOf(filter) === -1) return;
          var item = document.createElement('button');
          item.type = 'button';
          item.className = 'sb-btn toc-item' + (index === helpSel ? ' active' : '');
          item.textContent = topic.title;
          if (index === helpSel) item.setAttribute('aria-current', 'page');
          item.addEventListener('click', function () {
            loadTopic(index);
          });
          helpTocList.appendChild(item);
        });
      }

      function saveHelpLocation() {
        var url = new URL(window.location.href);
        var topic = helpTopics[helpSel];
        if (topic) url.searchParams.set('topic', topic.file);
        url.searchParams.set('lang', helpLang);
        if (helpFilter.value) url.searchParams.set('filter', helpFilter.value);
        else url.searchParams.delete('filter');
        if (helpSearch.value) url.searchParams.set('q', helpSearch.value); else url.searchParams.delete('q');
        if (globalMode) url.searchParams.set('all', '1'); else url.searchParams.delete('all');
        window.history.replaceState(null, '', url.pathname + url.search + url.hash);
      }

      function loadTopic(index) {
        var generation = ++topicLoadGeneration;
        var language = helpLang;
        helpSel = index;
        renderToc();
        var topic = helpTopics[index];
        if (!topic) return;
        saveHelpLocation();
        rawHtml = null;
        searchMarks = [];
        searchIndex = -1;
        helpSearchCount.textContent = '';
        helpContent.innerHTML = '<div class="help-loading">Loading...</div>';
        fetch(appPath('/api/help/content?file=') + encodeURIComponent(topic.file) + '&lang=' + language, { credentials: 'same-origin' })
          .then(function (response) {
            if (!response.ok) throw new Error('HTTP ' + response.status);
            return response.json();
          })
          .then(function (data) {
            if (generation !== topicLoadGeneration || language !== helpLang) return;
            rawHtml = renderMarkdown(data.content || '');
            topicCache[index] = rawHtml;
            helpContent.innerHTML = rawHtml;
            helpContent.scrollTop = 0;
            if (helpSearch.value.trim()) {
              if (globalMode) showGlobalResults(helpSearch.value.trim());
              else applySearch(helpSearch.value.trim());
            }
          })
          .catch(function () {
            if (generation !== topicLoadGeneration || language !== helpLang) return;
            helpContent.innerHTML = '<div class="help-loading">Failed to load content.</div>';
          });
      }

      function loadHelpIndex(keyword) {
        var generation = ++helpIndexGeneration;
        var language = helpLang;
        ++topicLoadGeneration;
        topicCache = {};
        rawHtml = null;
        helpTopics = [];
        helpContent.innerHTML = '<div class="help-loading">Loading...</div>';
        helpTocList.innerHTML = '<div class="help-loading">Loading...</div>';
        fetch(appPath('/api/help/index?lang=') + language, { credentials: 'same-origin' })
          .then(function (response) {
            if (!response.ok) throw new Error('HTTP ' + response.status);
            return response.json();
          })
          .then(function (data) {
            if (generation !== helpIndexGeneration || language !== helpLang) return;
            helpTopics = data || [];
            renderToc();
            if (!helpTopics.length) {
              helpContent.innerHTML = '<div class="help-loading">No help topics found.</div>';
              return;
            }
            var startIndex = 0;
            if (keyword) {
              var kw = String(keyword).toLowerCase();
              for (var i = 0; i < helpTopics.length; i += 1) {
                var file = String(helpTopics[i].file || '').toLowerCase();
                var title = String(helpTopics[i].title || '').toLowerCase();
                if (title.indexOf(kw) !== -1 || file.indexOf(kw) !== -1) {
                  startIndex = i;
                  break;
                }
              }
            }
            loadTopic(startIndex);
            helpLoaded = true;
          })
          .catch(function () {
            if (generation !== helpIndexGeneration || language !== helpLang) return;
            helpTocList.innerHTML = '<div class="help-loading">Failed to load topics.</div>';
            helpContent.innerHTML = '<div class="help-loading">Failed to load content.</div>';
          });
      }

      function openHelp(keyword) {
        if (!helpLoaded || keyword) loadHelpIndex(keyword || 'overview');
      }

      helpSearch.addEventListener('input', function () {
        saveHelpLocation();
        if (searchTimer) clearTimeout(searchTimer);
        searchTimer = setTimeout(function () {
          var term = helpSearch.value.trim();
          if (globalMode) showGlobalResults(term);
          else applySearch(term);
        }, 260);
      });

      helpSearch.addEventListener('keydown', function (event) {
        if (event.key === 'Enter' && !globalMode) {
          event.preventDefault();
          gotoMark(searchIndex + (event.shiftKey ? -1 : 1));
        }
        if (event.key === 'Escape') {
          event.preventDefault();
          event.stopPropagation();
          helpSearch.value = '';
          saveHelpLocation();
          if (globalMode) showGlobalResults('');
          else clearSearch();
        }
      });

      helpSearchUp.addEventListener('click', function () { gotoMark(searchIndex - 1); });
      helpSearchDn.addEventListener('click', function () { gotoMark(searchIndex + 1); });

      helpSearchGlobal.addEventListener('change', function () {
        globalMode = helpSearchGlobal.checked;
        saveHelpLocation();
        helpSearch.placeholder = globalMode ? 'Search all topics...' : 'Search in topic...';
        var term = helpSearch.value.trim();
        if (globalMode) {
          showGlobalResults(term);
        } else {
          if (rawHtml !== null) {
            helpContent.innerHTML = rawHtml;
            searchMarks = [];
            searchIndex = -1;
            helpSearchCount.textContent = '';
          }
          if (term) applySearch(term);
        }
      });

      helpFilter.addEventListener('input', function () { renderToc(); saveHelpLocation(); });

      helpLangEN.addEventListener('click', function () {
        if (helpLang === 'EN') return;
        helpLang = 'EN';
        localStorage.setItem('help-lang', helpLang);
        topicCache = {};
        setLanguageButtons();
        loadHelpIndex((helpTopics[helpSel] && helpTopics[helpSel].file) || 'overview');
      });

      helpLangDE.addEventListener('click', function () {
        if (helpLang === 'DE') return;
        helpLang = 'DE';
        localStorage.setItem('help-lang', helpLang);
        topicCache = {};
        setLanguageButtons();
        loadHelpIndex((helpTopics[helpSel] && helpTopics[helpSel].file) || 'overview');
      });

      window.openHelpOverlay = openHelp;

      setLanguageButtons();
      ensurePageMeta();
      openHelp(TOPIC || 'overview');
    }());
  </script>

  <script>
    window.PBGUI_NAV_CONFIG = {
      subtitle: 'HELP',
      current: 'help',
      authenticated: true,
      apiBase: API_BASE,
      version: PBGUI_VERSION,
      serial: PBGUI_SERIAL
    };
  </script>
  <script src="./pbgui_nav.js?v=1799"></script>
</body>
