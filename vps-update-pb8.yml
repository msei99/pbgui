---
# Install or update {{ passivbot_label }} on a selected remote PBGui host.
# Masters receive the full research profile; VPS runners receive live-only {{ passivbot_label }}.

- hosts: "{{ pb8_target_group if pb8_target_group is defined else hostname }}"
  gather_facts: no
  force_handlers: true

  vars:
    passivbot_product: "{{ runtime_product | default('pb8') }}"
    passivbot_major: "{{ 9 if passivbot_product == 'pb9' else 8 }}"
    passivbot_label: "{{ passivbot_product | upper }}"
    passivbot_default_branch: "{{ 'v9' if passivbot_product == 'pb9' else 'master' }}"
    install_dir: "{{ install_dir }}"
    pbgdir: "{{ install_dir }}/pbgui"
    pbgui_python: "{{ install_dir }}/venv_pbgui/bin/python"
    pb8dir: "{{ install_dir }}/{{ passivbot_product }}"
    pb8venv: "{{ install_dir }}/venv_{{ passivbot_product }}"
    pb8_required_free_bytes: "{{ pb8_min_free_bytes | default(536870912 if pb8_install_profile == 'live' else 3221225472) | int }}"
    pb8_branch_switch: "{{ (pb8_branch | default('') | string | trim | length) > 0 }}"
    pb8_target_branch: "{{ pb8_branch | default(passivbot_default_branch) }}"
    pb8_source_branch_value: "{{ pb8_source_branch | default(pb8_target_branch) }}"
    pb8_target_commit: "{{ pb8_commit | default('') }}"
    pb8_remote_name_value: "{{ pb8_remote_name | default('origin') }}"
    pb8_remote_url_value: "{{ pb8_remote_url | default('') }}"
    pb8_selected_ref: "{{ pb8_target_commit if pb8_target_commit != '' else 'refs/remotes/' ~ pb8_remote_name_value ~ '/' ~ pb8_source_branch_value }}"

  tasks:
    - name: Validate selected Passivbot generation
      assert:
        that: passivbot_product in ['pb8', 'pb9']
        fail_msg: "Unsupported Passivbot installation profile."

    - name: Check separate PB9 installation paths
      script:
        cmd: "passivbot_install_paths.py {{ passivbot_product }} {{ pbgdir | quote }} {{ pb8dir | quote }} {{ pb8venv | quote }}"
        executable: "{{ pbgui_python }}"
      changed_when: false
      when: passivbot_product == 'pb9'

    - name: Read remote PBGui role before {{ passivbot_label }} changes
      command:
        argv:
          - python3
          - -c
          - "import configparser,json,sys; from pathlib import Path; c=configparser.ConfigParser(); c.read(sys.argv[1]); role=c.get('main','role',fallback='').strip().lower(); identity=Path(sys.argv[2]); data=json.loads(identity.read_text(encoding='utf-8')) if not role and identity.is_file() else {}; print(role or str(data.get('role') or '').strip().lower())"
          - "{{ pbgdir }}/pbgui.ini"
          - "{{ pbgdir }}/data/cluster/node_identity.json"
      register: pb8_role_probe
      changed_when: false

    - name: Require supported PBGui role for {{ passivbot_label }}
      assert:
        that:
          - pb8_role_probe.stdout | trim | lower in ['master', 'vps', 'slave']
        fail_msg: "{{ passivbot_label }} can only be installed or updated on a PBGui master or VPS runner."

    - name: Select {{ passivbot_label }} installation profile
      set_fact:
        pb8_install_profile: "{{ 'full' if (pb8_role_probe.stdout | trim | lower) == 'master' else 'live' }}"

    - name: Resolve official {{ passivbot_label }} commit before checking the installed live runtime
      command:
        argv:
          - "{{ ansible_playbook_python }}"
          - "{{ playbook_dir }}/pb8_wheels.py"
          - resolve
          - --url=https://github.com/enarjord/passivbot.git
          - "--branch={{ passivbot_default_branch }}"
      delegate_to: localhost
      vars:
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
      register: pb8_preflight_head
      changed_when: false
      when: not pb8_branch_switch and pb8_install_profile == 'live'

    - name: Check whether the selected {{ passivbot_label }} live wheel is already installed
      command:
        argv:
          - "{{ pbgui_python }}"
          - "{{ pbgdir }}/pb_wheel_status.py"
          - "{{ pbgdir }}"
          - --check-product
          - "{{ passivbot_product }}"
          - --repo
          - "{{ pb8dir }}"
          - --python
          - "{{ pb8venv }}/bin/python"
          - --current-commit
          - "{{ (pb8_preflight_head.stdout | from_json).commit }}"
      register: pb8_current_live_wheel
      changed_when: false
      when: not pb8_branch_switch and pb8_install_profile == 'live'

    - name: Check whether PBRun is active before skipping {{ passivbot_label }}
      command:
        argv: [systemctl, --user, is-active, pbgui-pbrun.service]
      register: pb8_current_pbrun
      changed_when: false
      failed_when: false
      when: not pb8_branch_switch and pb8_install_profile == 'live'

    - name: Report already current {{ passivbot_label }} live runtime
      debug:
        msg: "{{ passivbot_label }} live wheel already matches official master; skipping download, reinstall and bot restart."
      when:
        - not pb8_branch_switch
        - pb8_install_profile == 'live'
        - (pb8_current_live_wheel.stdout | from_json).installed | bool
        - pb8_current_pbrun.rc == 0

    - name: Skip {{ passivbot_label }} update for an already current live runtime
      meta: end_host
      when:
        - not pb8_branch_switch
        - pb8_install_profile == 'live'
        - (pb8_current_live_wheel.stdout | from_json).installed | bool
        - pb8_current_pbrun.rc == 0

    - name: Measure {{ passivbot_label }} disk state before changes
      command:
        argv:
          - python3
          - -c
          - "import json,os,shutil,subprocess,sys; base=sys.argv[1]; paths=sys.argv[2:]; usage=shutil.disk_usage(base); sizes={p:(int((subprocess.run(['du','-sb',p],capture_output=True,text=True,check=False).stdout.split() or ['0'])[0]) if os.path.exists(p) else 0) for p in paths}; print(json.dumps({'free_bytes':usage.free,'total_bytes':usage.total,'sizes':sizes},sort_keys=True))"
          - "{{ install_dir }}"
          - "{{ pb8dir }}"
          - "{{ pb8venv }}"
      register: pb8_disk_before
      changed_when: false

    - name: Require free disk space for {{ passivbot_label }}
      assert:
        that:
          - (pb8_disk_before.stdout | from_json).free_bytes | int >= pb8_required_free_bytes | int
        fail_msg: >-
          {{ passivbot_label }} {{ pb8_install_profile }} installation/update requires at least
          {{ ((pb8_required_free_bytes | int) / 1073741824) | round(2) }} GiB free on {{ install_dir }};
          currently {{ (((pb8_disk_before.stdout | from_json).free_bytes | int) / 1073741824) | round(2) }} GiB is available.

    - name: Report {{ passivbot_label }} disk state before changes
      debug:
        msg: "{{ passivbot_label }} disk before profile={{ pb8_install_profile }} state={{ pb8_disk_before.stdout }}"

    - name: Acquire {{ passivbot_label }} update writer ownership
      script:
        cmd: "master_update_lock.py --acquire-writer {{ install_dir | quote }}"
        executable: "{{ pbgui_python }}"
      notify: Release {{ passivbot_label }} update writer ownership

    - name: Ensure {{ passivbot_label }} update state directory exists
      file:
        path: "{{ pbgdir }}/data/locks"
        state: directory
        mode: "0700"

    - name: Inspect existing {{ passivbot_label }} checkout
      stat:
        path: "{{ pb8dir }}/.git"
      register: pb8_git

    - name: Inspect {{ passivbot_label }} target
      stat:
        path: "{{ pb8dir }}"
      register: pb8_target

    - name: Refuse a non-Git {{ passivbot_label }} target
      fail:
        msg: "{{ passivbot_label }} target exists but is not a Git checkout: {{ pb8dir }}"
      when: not pb8_git.stat.exists and pb8_target.stat.exists

    # A clone left by an interrupted first install has no index yet; its
    # "deleted" entries are not local work and must not block the retry.
    - name: Inspect {{ passivbot_label }} checkout index
      stat:
        path: "{{ pb8dir }}/.git/index"
      register: pb8_git_index

    - name: Check {{ passivbot_label }} checkout for tracked changes
      command:
        argv:
          - git
          - status
          - --porcelain
          - --untracked-files=no
      args:
        chdir: "{{ pb8dir }}"
      register: pb8_git_status
      changed_when: false
      when: pb8_branch_switch and pb8_git_index.stat.exists

    - name: Refuse {{ passivbot_label }} branch switch with tracked changes
      assert:
        that:
          - pb8_git_status.stdout == ''
        fail_msg: "Uncommitted tracked changes detected in {{ passivbot_label }}. Commit or stash them before switching branches."
      when: pb8_branch_switch and pb8_git_index.stat.exists

    - name: Clone official Passivbot without checking out source
      command:
        argv:
          - git
          - clone
          - --no-checkout
          - https://github.com/enarjord/passivbot.git
          - "{{ pb8dir }}"
      when: not pb8_git.stat.exists

    - name: Fetch and verify latest official Passivbot v{{ passivbot_major }} for an existing checkout
      command:
        argv:
          - "{{ pbgui_python }}"
          - "{{ pbgdir }}/pb7_guard.py"
          - --repo
          - "{{ pb8dir }}"
          - --ref
          - refs/remotes/pbgui-pb7-pin/master
          - --expected-major
          - "{{ passivbot_major }}"
          - --fetch-url
          - https://github.com/enarjord/passivbot.git
      changed_when: false
      when:
        - pb8_git.stat.exists
        - not pb8_branch_switch

    - name: Fetch and verify latest official Passivbot v{{ passivbot_major }} for a new checkout
      command:
        argv:
          - "{{ pbgui_python }}"
          - "{{ pbgdir }}/pb7_guard.py"
          - --repo
          - "{{ pb8dir }}"
          - --ref
          - refs/remotes/pbgui-pb7-pin/master
          - --expected-major
          - "{{ passivbot_major }}"
          - --fetch-url
          - https://github.com/enarjord/passivbot.git
      changed_when: false
      when:
        - not pb8_git.stat.exists
        - not pb8_branch_switch


    - name: Inspect selected {{ passivbot_label }} remote
      command:
        argv:
          - git
          - remote
          - get-url
          - "{{ pb8_remote_name_value }}"
      args:
        chdir: "{{ pb8dir }}"
      register: pb8_selected_remote
      failed_when: false
      changed_when: false
      when: pb8_branch_switch

    - name: Require URL for a missing {{ passivbot_label }} remote
      assert:
        that:
          - pb8_remote_url_value != ''
        fail_msg: "{{ passivbot_label }} remote {{ pb8_remote_name_value }} is not configured; provide its remote URL."
      when:
        - pb8_branch_switch
        - pb8_selected_remote.rc != 0

    - name: Add selected {{ passivbot_label }} remote
      command:
        argv:
          - git
          - remote
          - add
          - "{{ pb8_remote_name_value }}"
          - "{{ pb8_remote_url_value }}"
      args:
        chdir: "{{ pb8dir }}"
      when:
        - pb8_branch_switch
        - pb8_selected_remote.rc != 0

    - name: Update selected {{ passivbot_label }} remote URL
      command:
        argv:
          - git
          - remote
          - set-url
          - "{{ pb8_remote_name_value }}"
          - "{{ pb8_remote_url_value }}"
      args:
        chdir: "{{ pb8dir }}"
      when:
        - pb8_branch_switch
        - pb8_selected_remote.rc == 0
        - pb8_remote_url_value != ''

    - name: Fetch selected {{ passivbot_label }} remote
      command:
        argv:
          - git
          - fetch
          - "{{ pb8_remote_name_value }}"
      args:
        chdir: "{{ pb8dir }}"
      changed_when: false
      when: pb8_branch_switch

    - name: Require selected {{ passivbot_label }} source branch
      command:
        argv:
          - git
          - show-ref
          - --verify
          - --quiet
          - "refs/remotes/{{ pb8_remote_name_value }}/{{ pb8_source_branch_value }}"
      args:
        chdir: "{{ pb8dir }}"
      changed_when: false
      when: pb8_branch_switch

    - name: Resolve selected {{ passivbot_label }} ref
      command:
        argv:
          - git
          - rev-parse
          - "{{ pb8_selected_ref }}^{commit}"
      args:
        chdir: "{{ pb8dir }}"
      register: pb8_resolved_commit
      changed_when: false
      when: pb8_branch_switch

    - name: Require selected {{ passivbot_label }} commit to belong to source branch
      command:
        argv:
          - git
          - merge-base
          - --is-ancestor
          - "{{ pb8_resolved_commit.stdout }}"
          - "refs/remotes/{{ pb8_remote_name_value }}/{{ pb8_source_branch_value }}"
      args:
        chdir: "{{ pb8dir }}"
      changed_when: false
      when: pb8_branch_switch

    - name: Verify selected {{ passivbot_label }} commit before checkout
      command:
        argv:
          - "{{ pbgui_python }}"
          - "{{ pbgdir }}/pb7_guard.py"
          - --repo
          - "{{ pb8dir }}"
          - --ref
          - "{{ pb8_resolved_commit.stdout }}"
          - --expected-major
          - "{{ passivbot_major }}"
      changed_when: false
      when: pb8_branch_switch

    - name: Prepare central {{ passivbot_label }} wheels before runtime changes
      include_tasks: tasks/pb8_live_wheels_prepare.yml

    - name: Mark {{ passivbot_label }} runtime unavailable until validation completes
      copy:
        dest: "{{ pbgdir }}/data/locks/{{ 'pb9-runtime-invalid' if passivbot_product == 'pb9' else 'pb8-runtime-invalid' }}"
        content: "{{ passivbot_label }} installation or update in progress\n"
        mode: "0600"
      when: not pb8_branch_switch


    - name: Wait for already-starting {{ passivbot_label }} runners to cross the launch boundary
      script:
        cmd: "master_update_lock.py --barrier {{ pbgdir | quote }} --timeout 120"
        executable: "{{ pbgui_python }}"
      changed_when: false
      when: not pb8_branch_switch


    - name: Checkout verified official Passivbot v{{ passivbot_major }} commit
      command:
        argv:
          - "{{ pbgui_python }}"
          - "{{ pbgdir }}/pb7_guard.py"
          - --repo
          - "{{ pb8dir }}"
          - --ref
          - "{{ pb8_wheel_commit.stdout }}"
          - --expected-major
          - "{{ passivbot_major }}"
          - --checkout
      register: pb8_repo
      changed_when: "'checkout_changed=true' in pb8_repo.stdout"
      when: not pb8_branch_switch


    - name: Wait for starting {{ passivbot_label }} runners before branch checkout
      script:
        cmd: "master_update_lock.py --barrier {{ pbgdir | quote }} --timeout 120"
        executable: "{{ pbgui_python }}"
      changed_when: false
      when: pb8_branch_switch

    - name: Mark {{ passivbot_label }} runtime unavailable for branch checkout
      copy:
        dest: "{{ pbgdir }}/data/locks/{{ 'pb9-runtime-invalid' if passivbot_product == 'pb9' else 'pb8-runtime-invalid' }}"
        content: "{{ passivbot_label }} branch switch in progress\n"
        mode: "0600"
      when: pb8_branch_switch

    - name: Checkout selected {{ passivbot_label }} branch at verified commit
      command:
        argv:
          - git
          - checkout
          - -B
          - "{{ pb8_target_branch }}"
          - "{{ pb8_wheel_commit.stdout }}"
      args:
        chdir: "{{ pb8dir }}"
      register: pb8_branch_checkout
      changed_when: true
      when: pb8_branch_switch

    - name: Set selected {{ passivbot_label }} branch upstream
      command:
        argv:
          - git
          - branch
          - --set-upstream-to
          - "{{ pb8_remote_name_value }}/{{ pb8_source_branch_value }}"
          - "{{ pb8_target_branch }}"
      args:
        chdir: "{{ pb8dir }}"
      changed_when: false
      when: pb8_branch_switch

    - name: Check {{ passivbot_label }} virtualenv
      stat:
        path: "{{ pb8venv }}/bin/python"
      register: pb8_python

    - name: Create {{ passivbot_label }} virtualenv
      command:
        argv:
          - python3.12
          - -m
          - venv
          - "{{ pb8venv }}"
      when: not pb8_python.stat.exists

    - name: Install binary {{ passivbot_label }} dependencies
      command:
        argv:
          - "{{ pb8venv }}/bin/python"
          - -m
          - pip
          - install
          - --no-index
          - "--only-binary=:all:"
          - --find-links
          - "{{ pb8_wheel_remote_stage.path }}/bundle"
          - "{{ pb8_wheel_remote_stage.path }}/bundle/{{ pb8_wheel_manifest.python_wheel }}{{ pb8_wheel_extras }}"

    - name: Install verified {{ passivbot_label }} wheels
      command:
        argv:
          - "{{ pb8venv }}/bin/python"
          - -m
          - pip
          - install
          - --no-index
          - "--only-binary=:all:"
          - --no-deps
          - --force-reinstall
          - "{{ pb8_wheel_remote_stage.path }}/bundle/{{ pb8_wheel_manifest.python_wheel }}"
          - "{{ pb8_wheel_remote_stage.path }}/bundle/{{ pb8_wheel_manifest.rust_wheel }}"

    - name: Install source-bound {{ passivbot_label }} Cargo lockfile
      copy:
        src: "{{ pb8_wheel_remote_stage.path }}/bundle/Cargo.lock"
        dest: "{{ pb8dir }}/passivbot-rust/Cargo.lock"
        remote_src: true
        mode: "0600"

    - name: Validate centrally built {{ passivbot_label }} runtime
      script:
        cmd: "pb8_wheels.py runtime --product {{ passivbot_product }} --bundle {{ (pb8_wheel_remote_stage.path ~ '/bundle') | quote }} --repo {{ pb8dir | quote }} --commit {{ pb8_wheel_commit.stdout | quote }} --receipt {{ (pbgdir ~ '/data/state/' ~ passivbot_product ~ '-wheel.json') | quote }}"
        executable: "{{ pb8venv }}/bin/python"
      changed_when: false

    - name: Validate {{ passivbot_label }} CLI
      command:
        argv:
          - "{{ pb8venv }}/bin/passivbot"
          - --help
      changed_when: false

    - name: Validate {{ passivbot_label }} schema without source compilation
      command:
        argv:
          - "{{ pb8venv }}/bin/python"
          - -c
          - "from config.schema import CONFIG_SCHEMA_VERSION; assert str(CONFIG_SCHEMA_VERSION).startswith('v{{ passivbot_major }}.'), CONFIG_SCHEMA_VERSION; print(CONFIG_SCHEMA_VERSION)"
      args:
        chdir: "{{ pb8dir }}"
      changed_when: false

    - name: Remove unused Rust build tools on verified VPS
      script:
        cmd: "pb_wheel_status.py {{ pbgdir | quote }}"
        executable: "{{ pbgui_python }}"
      register: pb8_rust_cleanup
      changed_when: "(pb8_rust_cleanup.stdout | from_json).cleaned | default(false)"
      when: pb8_install_profile == 'live'

    - name: Remove obsolete Ubuntu rustup package on verified VPS
      apt:
        name: rustup
        state: absent
      become: yes
      ignore_errors: yes
      when:
        - pb8_install_profile == 'live'
        - (pb8_rust_cleanup.stdout | from_json).cleaned | default(false)

    - name: Save {{ passivbot_label }} runtime paths after validation
      command:
        argv:
          - "{{ pbgui_python }}"
          - -c
          - "import configparser,sys; from pbgui_purefunc import save_ini_section; c=configparser.ConfigParser(); c.read('pbgui.ini'); desired={'{{ passivbot_product }}dir':sys.argv[1],'{{ passivbot_product }}venv':sys.argv[2]}; changed=any(c.get('main',k,fallback='') != v for k,v in desired.items()); save_ini_section('main', desired) if changed else None; print('changed=' + str(changed).lower())"
          - "{{ pb8dir }}"
          - "{{ pb8venv }}/bin/python"
      args:
        chdir: "{{ pbgdir }}"
      register: save_pb8_paths
      changed_when: "'changed=true' in save_pb8_paths.stdout"

    - name: Mark validated {{ passivbot_label }} runtime available
      file:
        path: "{{ pbgdir }}/data/locks/{{ 'pb9-runtime-invalid' if passivbot_product == 'pb9' else 'pb8-runtime-invalid' }}"
        state: absent

    - name: Restart managed {{ passivbot_label }} live bots after successful update
      script:
        cmd: "pb8_live_stop.py {{ pbgdir | quote }} {{ pb8dir | quote }} {{ (pb8venv ~ '/bin/python') | quote }} --runtime {{ passivbot_product }}"
        executable: "{{ pbgui_python }}"
      register: pb8_live_restart
      changed_when: "'stopped_processes=0' not in pb8_live_restart.stdout"
      when: pb8_git.stat.exists

    - name: Detect configured PB7 runtime for shared PBRun supervision
      command:
        argv:
          - python3
          - -c
          - "import configparser,sys; c=configparser.ConfigParser(); c.read(sys.argv[1]); print('true' if c.get('main','pb7dir',fallback='').strip() and c.get('main','pb7venv',fallback='').strip() else 'false')"
          - "{{ pbgdir }}/pbgui.ini"
      register: pb8_pb7_runtime_probe
      changed_when: false

    - name: Detect {{ passivbot_label }}-only support in installed PBRun
      command:
        argv:
          - grep
          - -q
          - "self.pb8_ready = bool"
          - "{{ pbgdir }}/PBRun.py"
      register: pb8_pbrun_compatibility_probe
      changed_when: false
      failed_when: false

    - name: Ensure PBRun is enabled for {{ passivbot_label }} live supervision
      command:
        argv:
          - /bin/bash
          - "{{ pbgdir }}/setup/setup_systemd.sh"
          - --user
          - "{{ user }}"
          - --pbgui-dir
          - "{{ pbgdir }}"
          - --python
          - "{{ pbgui_python }}"
          - --enable
          - pbrun
          - --no-disable-excluded
          - --no-start
      when:
        - pb8_install_profile == 'live'
        - (pb8_pb7_runtime_probe.stdout | trim | lower) == 'true' or pb8_pbrun_compatibility_probe.rc == 0

    - name: Check whether PBRun is already active
      command:
        argv:
          - systemctl
          - --user
          - is-active
          - pbgui-pbrun.service
      register: pb8_pbrun_active
      changed_when: false
      failed_when: false
      when:
        - pb8_install_profile == 'live'
        - (pb8_pb7_runtime_probe.stdout | trim | lower) == 'true' or pb8_pbrun_compatibility_probe.rc == 0

    - name: Start PBRun when inactive
      command:
        argv:
          - systemctl
          - --user
          - start
          - pbgui-pbrun.service
      when:
        - pb8_install_profile == 'live'
        - (pb8_pb7_runtime_probe.stdout | trim | lower) == 'true' or pb8_pbrun_compatibility_probe.rc == 0
        - pb8_pbrun_active.rc != 0

    - name: Disable incompatible PBRun on {{ passivbot_label }}-only hosts
      command:
        argv:
          - systemctl
          - --user
          - disable
          - --now
          - pbgui-pbrun.service
      register: pb8_pbrun_disable
      changed_when: pb8_pbrun_disable.rc == 0
      failed_when: false
      when:
        - pb8_install_profile == 'live'
        - (pb8_pb7_runtime_probe.stdout | trim | lower) != 'true'
        - pb8_pbrun_compatibility_probe.rc != 0

    - name: Report {{ passivbot_label }}-only PBRun upgrade requirement
      debug:
        msg: "{{ passivbot_label }} is installed, but this PBGui release does not support {{ passivbot_label }}-only PBRun supervision. Update PBGui before enabling {{ passivbot_label }} live instances."
      when:
        - pb8_install_profile == 'live'
        - (pb8_pb7_runtime_probe.stdout | trim | lower) != 'true'
        - pb8_pbrun_compatibility_probe.rc != 0

    - name: Measure {{ passivbot_label }} disk state after validation
      command:
        argv:
          - python3
          - -c
          - "import json,os,shutil,subprocess,sys; base=sys.argv[1]; paths=sys.argv[2:]; usage=shutil.disk_usage(base); sizes={p:(int((subprocess.run(['du','-sb',p],capture_output=True,text=True,check=False).stdout.split() or ['0'])[0]) if os.path.exists(p) else 0) for p in paths}; print(json.dumps({'free_bytes':usage.free,'total_bytes':usage.total,'sizes':sizes},sort_keys=True))"
          - "{{ install_dir }}"
          - "{{ pb8dir }}"
          - "{{ pb8venv }}"
      register: pb8_disk_after
      changed_when: false

    - name: Report {{ passivbot_label }} disk state after validation
      debug:
        msg: "{{ passivbot_label }} disk after profile={{ pb8_install_profile }} state={{ pb8_disk_after.stdout }}"

  handlers:
    - name: Release {{ passivbot_label }} update writer ownership
      file:
        path: "{{ install_dir }}/.pbgui-pb8-update-active"
        state: absent

    - name: Clean master {{ passivbot_label }} wheel staging
      file:
        path: "{{ pb8_wheel_master_stage.path }}"
        state: absent
      delegate_to: localhost
      vars:
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
      when: pb8_wheel_master_stage is defined and pb8_wheel_master_stage.path is defined

    - name: Clean runner {{ passivbot_label }} wheel staging
      file:
        path: "{{ pb8_wheel_remote_stage.path }}"
        state: absent
      when: pb8_wheel_remote_stage is defined and pb8_wheel_remote_stage.path is defined
