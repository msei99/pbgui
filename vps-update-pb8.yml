---
# Install or update PB8 on a selected remote PBGui host.
# Masters receive the full research profile; VPS runners receive live-only PB8.

- hosts: "{{ pb8_target_group if pb8_target_group is defined else hostname }}"
  gather_facts: no
  force_handlers: true

  vars:
    install_dir: "{{ install_dir }}"
    pbgdir: "{{ install_dir }}/pbgui"
    pbgui_python: "{{ install_dir }}/venv_pbgui/bin/python"
    pb8dir: "{{ install_dir }}/pb8"
    pb8venv: "{{ install_dir }}/venv_pb8"
    pb8_required_free_bytes: "{{ pb8_min_free_bytes | default(3221225472) | int }}"
    pb8_branch_switch: "{{ (pb8_branch | default('') | string | trim | length) > 0 }}"
    pb8_target_branch: "{{ pb8_branch | default('master') }}"
    pb8_source_branch_value: "{{ pb8_source_branch | default(pb8_target_branch) }}"
    pb8_target_commit: "{{ pb8_commit | default('') }}"
    pb8_remote_name_value: "{{ pb8_remote_name | default('origin') }}"
    pb8_remote_url_value: "{{ pb8_remote_url | default('') }}"
    pb8_selected_ref: "{{ pb8_target_commit if pb8_target_commit != '' else 'refs/remotes/' ~ pb8_remote_name_value ~ '/' ~ pb8_source_branch_value }}"

  tasks:
    - name: Read remote PBGui role before PB8 changes
      command:
        argv:
          - python3
          - -c
          - "import configparser,json,sys; from pathlib import Path; c=configparser.ConfigParser(); c.read(sys.argv[1]); role=c.get('main','role',fallback='').strip().lower(); identity=Path(sys.argv[2]); data=json.loads(identity.read_text(encoding='utf-8')) if not role and identity.is_file() else {}; print(role or str(data.get('role') or '').strip().lower())"
          - "{{ pbgdir }}/pbgui.ini"
          - "{{ pbgdir }}/data/cluster/node_identity.json"
      register: pb8_role_probe
      changed_when: false

    - name: Require supported PBGui role for PB8
      assert:
        that:
          - pb8_role_probe.stdout | trim | lower in ['master', 'vps', 'slave']
        fail_msg: "PB8 can only be installed or updated on a PBGui master or VPS runner."

    - name: Select PB8 installation profile
      set_fact:
        pb8_install_profile: "{{ 'full' if (pb8_role_probe.stdout | trim | lower) == 'master' else 'live' }}"

    - name: Measure PB8 disk state before changes
      command:
        argv:
          - python3
          - -c
          - "import json,os,shutil,subprocess,sys; base=sys.argv[1]; paths=sys.argv[2:]; usage=shutil.disk_usage(base); sizes={p:(int((subprocess.run(['du','-sb',p],capture_output=True,text=True,check=False).stdout.split() or ['0'])[0]) if os.path.exists(p) else 0) for p in paths}; print(json.dumps({'free_bytes':usage.free,'total_bytes':usage.total,'sizes':sizes},sort_keys=True))"
          - "{{ install_dir }}"
          - "{{ pb8dir }}"
          - "{{ pb8venv }}"
      register: pb8_disk_before
      changed_when: false

    - name: Require free disk space for PB8
      assert:
        that:
          - (pb8_disk_before.stdout | from_json).free_bytes | int >= pb8_required_free_bytes | int
        fail_msg: >-
          PB8 {{ pb8_install_profile }} installation/update requires at least
          {{ ((pb8_required_free_bytes | int) / 1073741824) | round(2) }} GiB free on {{ install_dir }};
          currently {{ (((pb8_disk_before.stdout | from_json).free_bytes | int) / 1073741824) | round(2) }} GiB is available.

    - name: Report PB8 disk state before changes
      debug:
        msg: "PB8 disk before profile={{ pb8_install_profile }} state={{ pb8_disk_before.stdout }}"

    - name: Acquire PB8 update writer ownership
      script:
        cmd: "master_update_lock.py --acquire-writer {{ install_dir | quote }}"
        executable: "{{ pbgui_python }}"
      notify: Release PB8 update writer ownership

    - name: Check PB8 prerequisites
      shell: |
        command -v git
        command -v curl
        command -v gcc
        command -v python3.12
        python3.12 -c 'import venv, ensurepip'
      args:
        executable: /bin/bash
      changed_when: false

    - name: Install rustup when missing
      shell: |
        if ! command -v rustup >/dev/null 2>&1; then
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
        fi
      args:
        executable: /bin/bash

    - name: Install PB8 Rust toolchain
      shell: |
        if [ -f "$HOME/.cargo/env" ]; then
          source "$HOME/.cargo/env"
        fi
        rustup toolchain install 1.90.0
      args:
        executable: /bin/bash
      changed_when: false

    - name: Ensure PB8 update state directory exists
      file:
        path: "{{ pbgdir }}/data/locks"
        state: directory
        mode: "0700"

    - name: Mark PB8 runtime unavailable until validation completes
      copy:
        dest: "{{ pbgdir }}/data/locks/pb8-runtime-invalid"
        content: "PB8 installation or update in progress\n"
        mode: "0600"
      when: not pb8_branch_switch

    - name: Wait for already-starting PB8 runners to cross the launch boundary
      script:
        cmd: "master_update_lock.py --barrier {{ pbgdir | quote }} --timeout 120"
        executable: "{{ pbgui_python }}"
      changed_when: false
      when: not pb8_branch_switch

    - name: Inspect existing PB8 checkout
      stat:
        path: "{{ pb8dir }}/.git"
      register: pb8_git

    - name: Inspect PB8 target
      stat:
        path: "{{ pb8dir }}"
      register: pb8_target

    - name: Refuse a non-Git PB8 target
      fail:
        msg: "PB8 target exists but is not a Git checkout: {{ pb8dir }}"
      when: not pb8_git.stat.exists and pb8_target.stat.exists

    - name: Require installed PB8 checkout for branch switch
      assert:
        that:
          - pb8_git.stat.exists
        fail_msg: "Install PB8 before switching its branch."
      when: pb8_branch_switch

    - name: Check PB8 checkout for tracked changes
      command:
        argv:
          - git
          - status
          - --porcelain
          - --untracked-files=no
      args:
        chdir: "{{ pb8dir }}"
      register: pb8_git_status
      changed_when: false
      when: pb8_branch_switch

    - name: Refuse PB8 branch switch with tracked changes
      assert:
        that:
          - pb8_git_status.stdout == ''
        fail_msg: "Uncommitted tracked changes detected in PB8. Commit or stash them before switching branches."
      when: pb8_branch_switch

    - name: Clone official Passivbot without checking out source
      command:
        argv:
          - git
          - clone
          - --no-checkout
          - https://github.com/enarjord/passivbot.git
          - "{{ pb8dir }}"
      when: not pb8_git.stat.exists

    - name: Fetch and verify latest official Passivbot v8 for an existing checkout
      command:
        argv:
          - "{{ pbgui_python }}"
          - "{{ pbgdir }}/pb7_guard.py"
          - --repo
          - "{{ pb8dir }}"
          - --ref
          - refs/remotes/pbgui-pb7-pin/master
          - --expected-major
          - "8"
          - --fetch-url
          - https://github.com/enarjord/passivbot.git
      changed_when: false
      when:
        - pb8_git.stat.exists
        - not pb8_branch_switch

    - name: Fetch and verify latest official Passivbot v8 for a new checkout
      command:
        argv:
          - "{{ pbgui_python }}"
          - "{{ pbgdir }}/pb7_guard.py"
          - --repo
          - "{{ pb8dir }}"
          - --ref
          - refs/remotes/pbgui-pb7-pin/master
          - --expected-major
          - "8"
          - --fetch-url
          - https://github.com/enarjord/passivbot.git
      changed_when: false
      when:
        - not pb8_git.stat.exists
        - not pb8_branch_switch

    - name: Checkout verified official Passivbot v8 commit
      command:
        argv:
          - "{{ pbgui_python }}"
          - "{{ pbgdir }}/pb7_guard.py"
          - --repo
          - "{{ pb8dir }}"
          - --ref
          - refs/remotes/pbgui-pb7-pin/master
          - --expected-major
          - "8"
          - --checkout
      register: pb8_repo
      changed_when: "'checkout_changed=true' in pb8_repo.stdout"
      when: not pb8_branch_switch

    - name: Inspect selected PB8 remote
      command:
        argv:
          - git
          - remote
          - get-url
          - "{{ pb8_remote_name_value }}"
      args:
        chdir: "{{ pb8dir }}"
      register: pb8_selected_remote
      failed_when: false
      changed_when: false
      when: pb8_branch_switch

    - name: Require URL for a missing PB8 remote
      assert:
        that:
          - pb8_remote_url_value != ''
        fail_msg: "PB8 remote {{ pb8_remote_name_value }} is not configured; provide its remote URL."
      when:
        - pb8_branch_switch
        - pb8_selected_remote.rc != 0

    - name: Add selected PB8 remote
      command:
        argv:
          - git
          - remote
          - add
          - "{{ pb8_remote_name_value }}"
          - "{{ pb8_remote_url_value }}"
      args:
        chdir: "{{ pb8dir }}"
      when:
        - pb8_branch_switch
        - pb8_selected_remote.rc != 0

    - name: Update selected PB8 remote URL
      command:
        argv:
          - git
          - remote
          - set-url
          - "{{ pb8_remote_name_value }}"
          - "{{ pb8_remote_url_value }}"
      args:
        chdir: "{{ pb8dir }}"
      when:
        - pb8_branch_switch
        - pb8_selected_remote.rc == 0
        - pb8_remote_url_value != ''

    - name: Fetch selected PB8 remote
      command:
        argv:
          - git
          - fetch
          - "{{ pb8_remote_name_value }}"
      args:
        chdir: "{{ pb8dir }}"
      changed_when: false
      when: pb8_branch_switch

    - name: Require selected PB8 source branch
      command:
        argv:
          - git
          - show-ref
          - --verify
          - --quiet
          - "refs/remotes/{{ pb8_remote_name_value }}/{{ pb8_source_branch_value }}"
      args:
        chdir: "{{ pb8dir }}"
      changed_when: false
      when: pb8_branch_switch

    - name: Resolve selected PB8 ref
      command:
        argv:
          - git
          - rev-parse
          - "{{ pb8_selected_ref }}^{commit}"
      args:
        chdir: "{{ pb8dir }}"
      register: pb8_resolved_commit
      changed_when: false
      when: pb8_branch_switch

    - name: Require selected PB8 commit to belong to source branch
      command:
        argv:
          - git
          - merge-base
          - --is-ancestor
          - "{{ pb8_resolved_commit.stdout }}"
          - "refs/remotes/{{ pb8_remote_name_value }}/{{ pb8_source_branch_value }}"
      args:
        chdir: "{{ pb8dir }}"
      changed_when: false
      when: pb8_branch_switch

    - name: Verify selected PB8 commit before checkout
      command:
        argv:
          - "{{ pbgui_python }}"
          - "{{ pbgdir }}/pb7_guard.py"
          - --repo
          - "{{ pb8dir }}"
          - --ref
          - "{{ pb8_resolved_commit.stdout }}"
          - --expected-major
          - "8"
      changed_when: false
      when: pb8_branch_switch

    - name: Wait for starting PB8 runners before branch checkout
      script:
        cmd: "master_update_lock.py --barrier {{ pbgdir | quote }} --timeout 120"
        executable: "{{ pbgui_python }}"
      changed_when: false
      when: pb8_branch_switch

    - name: Mark PB8 runtime unavailable for branch checkout
      copy:
        dest: "{{ pbgdir }}/data/locks/pb8-runtime-invalid"
        content: "PB8 branch switch in progress\n"
        mode: "0600"
      when: pb8_branch_switch

    - name: Checkout selected PB8 branch at verified commit
      command:
        argv:
          - git
          - checkout
          - -B
          - "{{ pb8_target_branch }}"
          - "{{ pb8_resolved_commit.stdout }}"
      args:
        chdir: "{{ pb8dir }}"
      register: pb8_branch_checkout
      changed_when: true
      when: pb8_branch_switch

    - name: Set selected PB8 branch upstream
      command:
        argv:
          - git
          - branch
          - --set-upstream-to
          - "{{ pb8_remote_name_value }}/{{ pb8_source_branch_value }}"
          - "{{ pb8_target_branch }}"
      args:
        chdir: "{{ pb8dir }}"
      changed_when: false
      when: pb8_branch_switch

    - name: Check PB8 virtualenv
      stat:
        path: "{{ pb8venv }}/bin/python"
      register: pb8_python

    - name: Create PB8 virtualenv
      command:
        argv:
          - python3.12
          - -m
          - venv
          - "{{ pb8venv }}"
      when: not pb8_python.stat.exists

    - name: Upgrade PB8 pip
      command:
        argv:
          - "{{ pb8venv }}/bin/python"
          - -m
          - pip
          - install
          - --upgrade
          - pip

    - name: Install PB8 full profile
      shell: |
        if [ -f "$HOME/.cargo/env" ]; then
          source "$HOME/.cargo/env"
        fi
        "{{ pb8venv }}/bin/python" -m pip install --no-cache-dir --upgrade -e "{{ pb8dir }}[full]"
      args:
        executable: /bin/bash
      when: pb8_install_profile == 'full'

    - name: Install PB8 live profile
      shell: |
        if [ -f "$HOME/.cargo/env" ]; then
          source "$HOME/.cargo/env"
        fi
        "{{ pb8venv }}/bin/python" -m pip install --no-cache-dir --upgrade -e "{{ pb8dir }}"
      args:
        executable: /bin/bash
      when: pb8_install_profile == 'live'

    - name: Validate PB8 CLI
      command:
        argv:
          - "{{ pb8venv }}/bin/passivbot"
          - --help
      changed_when: false

    - name: Remove PB8 Rust build artifacts on live-only runners
      file:
        path: "{{ pb8dir }}/passivbot-rust/target"
        state: absent
      when: pb8_install_profile == 'live'

    - name: Stamp and validate PB8 Rust source fingerprint
      command:
        argv:
          - "{{ pb8venv }}/bin/python"
          - -c
          - "from rust_utils import check_and_maybe_compile, source_fingerprint, stamp_compiled_extensions; stamp_compiled_extensions(source_fingerprint()); check_and_maybe_compile(fail_on_stale=True); import passivbot_rust; from config.schema import CONFIG_SCHEMA_VERSION; assert str(CONFIG_SCHEMA_VERSION).startswith('v8.'), CONFIG_SCHEMA_VERSION; print(CONFIG_SCHEMA_VERSION)"
      args:
        chdir: "{{ pb8dir }}"
      changed_when: false

    - name: Save PB8 runtime paths after validation
      command:
        argv:
          - "{{ pbgui_python }}"
          - -c
          - "import configparser,sys; from pbgui_purefunc import save_ini_section; c=configparser.ConfigParser(); c.read('pbgui.ini'); desired={'pb8dir':sys.argv[1],'pb8venv':sys.argv[2]}; changed=any(c.get('main',k,fallback='') != v for k,v in desired.items()); save_ini_section('main', desired) if changed else None; print('changed=' + str(changed).lower())"
          - "{{ pb8dir }}"
          - "{{ pb8venv }}/bin/python"
      args:
        chdir: "{{ pbgdir }}"
      register: save_pb8_paths
      changed_when: "'changed=true' in save_pb8_paths.stdout"

    - name: Mark validated PB8 runtime available
      file:
        path: "{{ pbgdir }}/data/locks/pb8-runtime-invalid"
        state: absent

    - name: Restart managed PB8 live bots after successful update
      script:
        cmd: "pb8_live_stop.py {{ pbgdir | quote }} {{ pb8dir | quote }} {{ (pb8venv ~ '/bin/python') | quote }}"
        executable: "{{ pbgui_python }}"
      register: pb8_live_restart
      changed_when: "'stopped_processes=0' not in pb8_live_restart.stdout"
      when: pb8_git.stat.exists

    - name: Detect configured PB7 runtime for shared PBRun supervision
      command:
        argv:
          - python3
          - -c
          - "import configparser,sys; c=configparser.ConfigParser(); c.read(sys.argv[1]); print('true' if c.get('main','pb7dir',fallback='').strip() and c.get('main','pb7venv',fallback='').strip() else 'false')"
          - "{{ pbgdir }}/pbgui.ini"
      register: pb8_pb7_runtime_probe
      changed_when: false

    - name: Detect PB8-only support in installed PBRun
      command:
        argv:
          - grep
          - -q
          - "self.pb8_ready = bool"
          - "{{ pbgdir }}/PBRun.py"
      register: pb8_pbrun_compatibility_probe
      changed_when: false
      failed_when: false

    - name: Ensure PBRun is enabled for PB8 live supervision
      command:
        argv:
          - /bin/bash
          - "{{ pbgdir }}/setup/setup_systemd.sh"
          - --user
          - "{{ user }}"
          - --pbgui-dir
          - "{{ pbgdir }}"
          - --python
          - "{{ pbgui_python }}"
          - --enable
          - pbrun
          - --no-disable-excluded
          - --no-start
      when:
        - pb8_install_profile == 'live'
        - (pb8_pb7_runtime_probe.stdout | trim | lower) == 'true' or pb8_pbrun_compatibility_probe.rc == 0

    - name: Check whether PBRun is already active
      command:
        argv:
          - systemctl
          - --user
          - is-active
          - pbgui-pbrun.service
      register: pb8_pbrun_active
      changed_when: false
      failed_when: false
      when:
        - pb8_install_profile == 'live'
        - (pb8_pb7_runtime_probe.stdout | trim | lower) == 'true' or pb8_pbrun_compatibility_probe.rc == 0

    - name: Start PBRun when inactive
      command:
        argv:
          - systemctl
          - --user
          - start
          - pbgui-pbrun.service
      when:
        - pb8_install_profile == 'live'
        - (pb8_pb7_runtime_probe.stdout | trim | lower) == 'true' or pb8_pbrun_compatibility_probe.rc == 0
        - pb8_pbrun_active.rc != 0

    - name: Disable incompatible PBRun on PB8-only hosts
      command:
        argv:
          - systemctl
          - --user
          - disable
          - --now
          - pbgui-pbrun.service
      register: pb8_pbrun_disable
      changed_when: pb8_pbrun_disable.rc == 0
      failed_when: false
      when:
        - pb8_install_profile == 'live'
        - (pb8_pb7_runtime_probe.stdout | trim | lower) != 'true'
        - pb8_pbrun_compatibility_probe.rc != 0

    - name: Report PB8-only PBRun upgrade requirement
      debug:
        msg: "PB8 is installed, but this PBGui release does not support PB8-only PBRun supervision. Update PBGui before enabling PB8 live instances."
      when:
        - pb8_install_profile == 'live'
        - (pb8_pb7_runtime_probe.stdout | trim | lower) != 'true'
        - pb8_pbrun_compatibility_probe.rc != 0

    - name: Measure PB8 disk state after validation
      command:
        argv:
          - python3
          - -c
          - "import json,os,shutil,subprocess,sys; base=sys.argv[1]; paths=sys.argv[2:]; usage=shutil.disk_usage(base); sizes={p:(int((subprocess.run(['du','-sb',p],capture_output=True,text=True,check=False).stdout.split() or ['0'])[0]) if os.path.exists(p) else 0) for p in paths}; print(json.dumps({'free_bytes':usage.free,'total_bytes':usage.total,'sizes':sizes},sort_keys=True))"
          - "{{ install_dir }}"
          - "{{ pb8dir }}"
          - "{{ pb8venv }}"
      register: pb8_disk_after
      changed_when: false

    - name: Report PB8 disk state after validation
      debug:
        msg: "PB8 disk after profile={{ pb8_install_profile }} state={{ pb8_disk_after.stdout }}"

  handlers:
    - name: Release PB8 update writer ownership
      file:
        path: "{{ install_dir }}/.pbgui-pb8-update-active"
        state: absent
