---
# Install pinned PB7 from centrally prepared wheels. VPS never compiles Rust.
- hosts: "{{ pb7_target_group if pb7_target_group is defined else hostname }}"
  gather_facts: false
  force_handlers: true
  vars:
    pbgdir: "{{ install_dir }}/pbgui"
    pbgui_python: "{{ install_dir }}/venv_pbgui/bin/python"
    pb7dir: "{{ install_dir }}/pb7"
    pb7venv: "{{ install_dir }}/venv_pb7"
    pb7_ref: "{{ lookup('file', playbook_dir + '/pb7_ref.txt') | trim }}"
    pb7_install_profile: live
    pb7_install_min_free_bytes: "{{ pb7_min_free_bytes | default(536870912) | int }}"

  tasks:
    - name: Read remote PBGui role before PB7 changes
      command:
        argv:
          - "{{ pbgui_python }}"
          - -c
          - "import configparser,sys; c=configparser.ConfigParser(); c.read(sys.argv[1]); print(c.get('main','role',fallback='').strip().lower())"
          - "{{ pbgdir }}/pbgui.ini"
      register: pb7_role_probe
      changed_when: false

    - name: Require supported PBGui role for PB7
      assert:
        that:
          - pb7_role_probe.stdout | trim | lower in ['master', 'vps', 'slave']

    - name: Select PB7 wheel installation profile
      set_fact:
        pb7_install_profile: "{{ 'full' if (pb7_role_probe.stdout | trim | lower) == 'master' else 'live' }}"

    - name: Validate pinned PB7 commit
      assert:
        that:
          - pb7_ref is match('^[0-9a-f]{40}$')
        fail_msg: "pb7_ref.txt must contain one exact lowercase commit SHA."

    - name: Measure PB7 disk space before new installation
      command:
        argv: [df, -PB1, "{{ install_dir }}"]
      register: pb7_disk_before
      changed_when: false

    - name: Inspect PB7 checkout before disk gate
      stat:
        path: "{{ pb7dir }}/.git"
      register: pb7_git_before_disk_gate

    - name: Require free disk space for a new PB7 installation
      assert:
        that:
          - (pb7_disk_before.stdout_lines[1].split()[3] | int) >= (pb7_install_min_free_bytes | int)
        fail_msg: "PB7 binary installation requires at least 512 MiB free before cloning."
      when: not pb7_git_before_disk_gate.stat.exists

    - name: Inspect existing PB7 checkout
      stat:
        path: "{{ pb7dir }}/.git"
      register: pb7_git

    - name: Inspect PB7 target
      stat:
        path: "{{ pb7dir }}"
      register: pb7_target

    - name: Refuse a non-Git PB7 target
      fail:
        msg: "PB7 target exists but is not a Git checkout: {{ pb7dir }}"
      when: not pb7_git.stat.exists and pb7_target.stat.exists

    - name: Clone official Passivbot for a new PB7 installation
      command:
        argv: [git, clone, --no-checkout, https://github.com/enarjord/passivbot.git, "{{ pb7dir }}"]
      when: not pb7_git.stat.exists

    - name: Fetch and verify pinned Passivbot v7
      command:
        argv:
          - "{{ pbgui_python }}"
          - "{{ pbgdir }}/pb7_guard.py"
          - --repo
          - "{{ pb7dir }}"
          - --ref
          - "{{ pb7_ref }}"
          - --expected-major
          - "7"
          - --fetch-url
          - https://github.com/enarjord/passivbot.git
      changed_when: false

    - name: Prepare central PB7 wheels before runtime changes
      include_tasks: tasks/pb7_wheels_prepare.yml

    - name: Stop PBRun before replacing PB7 runtime
      script: setup/vps_service_control.sh stop PBRun
      environment:
        PBGUI_DIR: "{{ pbgdir }}"
        PBGUI_PYTHON: "{{ pbgui_python }}"
        PBGUI_USER: "{{ user }}"
      changed_when: true
      notify: Recover PBRun after PB7 update

    - name: Stop PB7 processes before replacing runtime
      command:
        argv:
          - "{{ pbgui_python }}"
          - "{{ pbgdir }}/pb7_guard.py"
          - --repo
          - "{{ pb7dir }}"
          - --ref
          - "{{ pb7_ref }}"
          - --expected-major
          - "7"
          - --stop-processes
          - --venv
          - "{{ pb7venv }}"
      changed_when: false

    - name: Checkout verified pinned Passivbot v7
      command:
        argv:
          - "{{ pbgui_python }}"
          - "{{ pbgdir }}/pb7_guard.py"
          - --repo
          - "{{ pb7dir }}"
          - --ref
          - "{{ pb7_ref }}"
          - --expected-major
          - "7"
          - --checkout

    - name: Install and validate central PB7 wheels
      include_tasks: tasks/pb7_wheels_install.yml

  handlers:
    - name: Recover PBRun after PB7 update
      script: setup/vps_service_control.sh start PBRun
      environment:
        PBGUI_DIR: "{{ pbgdir }}"
        PBGUI_PYTHON: "{{ pbgui_python }}"
        PBGUI_USER: "{{ user }}"

    - name: Clean controller PB7 wheel staging
      file:
        path: "{{ pb7_wheel_master_stage.path }}"
        state: absent
      delegate_to: localhost
      when: pb7_wheel_master_stage is defined and pb7_wheel_master_stage.path is defined

    - name: Clean target PB7 wheel staging
      file:
        path: "{{ pb7_wheel_remote_stage.path }}"
        state: absent
      when: pb7_wheel_remote_stage is defined and pb7_wheel_remote_stage.path is defined
