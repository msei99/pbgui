---
# Update pbgui and pb7 on localhost
# Steps:
# 1. Clone pbgui repository
# 2. Sync PBGui systemd units and restart PBCluster/PBRun/PBData/PBCoinData/PBMonitorAgent if pbgui repository was updated
# 3. Clone passivbot repository for pb7
# 4. Restart all pb7 bots if pb7 repository was updated

- hosts: "{{ target_hosts | default('localhost') }}"
  gather_facts: "{{ debug }}"
  force_handlers: true

  vars:
    # ansible_ssh_pass: "{{ user_pw }}"
    # ansible_become_password: "{{ user_pw }}"
    pbgdir: "{{ pbgdir }}"
    pb7dir: "{{ pb7dir }}"
    pb7venv: "{{ pb7venv }}"
    pb7_ref: "{{ lookup('file', playbook_dir + '/pb7_ref.txt') | trim }}"
    pb7_install_profile: full
    # user_pw: "{{ user_pw }}"

  tasks:
    - name: display facts
      debug:
        var: ansible_facts
      tags: debug,never

    - name: Get current pbgui branch
      command: git rev-parse --abbrev-ref HEAD
      args:
        chdir: "{{ pbgdir }}"
      register: current_pbgui_branch
      changed_when: false
      when: pbgdir != ""

    - name: Get selected PBGui source
      command:
        argv: [git, remote, get-url, origin]
      args:
        chdir: "{{ pbgdir }}"
      register: current_pbgui_source
      changed_when: false
      when: pbgdir != ""
      no_log: true

    - name: clone pbgui repository
      git:
        repo: "{{ current_pbgui_source.stdout }}"
        dest: "{{ pbgdir }}"
        version: "{{ current_pbgui_branch.stdout }}"
        refspec: "+refs/heads/{{ current_pbgui_branch.stdout }}:refs/remotes/origin/{{ current_pbgui_branch.stdout }}"
        update: yes
        force: yes
      when: pbgdir != ""
      register: pbgui_repo
      no_log: true

    - name: Reconcile pbgui requirements
      command:
        argv:
          - "{{ pbgui_python | default(ansible_playbook_python) }}"
          - -m
          - pip
          - install
          - --upgrade
          - pip
          - -r
          - "{{ pbgdir }}/requirements.txt"
      when: pbgdir != ""
      register: pbgui_requirements
      changed_when: "'Successfully installed' in ((pbgui_requirements.stdout | default('')) + (pbgui_requirements.stderr | default('')))"

    - name: Migrate missing legacy master role
      command:
        argv:
          - "{{ pbgui_python | default(ansible_playbook_python) }}"
          - -c
          - "from pbgui_purefunc import load_ini, save_ini; role=load_ini('main', 'role').strip(); changed=not role; save_ini('main', 'role', 'master') if changed else None; print('changed=' + str(changed).lower())"
      args:
        chdir: "{{ pbgdir }}"
      when: pbgdir != ""
      register: legacy_master_role
      changed_when: "'changed=true' in (legacy_master_role.stdout | default(''))"

    - name: Schedule PBGui restart after successful update
      command: /bin/true
      when: pbgdir != ""
      changed_when: (pbgui_repo.changed | default(false)) or (pbgui_requirements.changed | default(false))
      notify: restart pbgui

    - name: print pbgui_repo
      debug:
        var: pbgui_repo
      tags: debug,never

    - name: Reconcile PBGui systemd user services
      command:
        argv:
          - /bin/bash
          - "{{ pbgdir }}/setup/setup_systemd.sh"
          - --pbgui-dir
          - "{{ pbgdir }}"
          - --python
          - "{{ pbgui_python | default(ansible_playbook_python) }}"
          - --preserve-state
      when: pbgdir != ""
      register: systemd_reconcile_result
      changed_when: "'changed=true' in (systemd_reconcile_result.stdout | default(''))"

    - name: Check whether monitor-agent was active
      command:
        argv:
          - systemctl
          - --user
          - is-active
          - --quiet
          - pbgui-monitor-agent.service
      when: pbgdir != ""
      register: monitor_agent_before
      changed_when: false
      failed_when: false

    - name: Check whether persistent VPS Monitor was active
      command:
        argv:
          - systemctl
          - --user
          - is-active
          - --quiet
          - pbgui-vps-monitor.service
      when: pbgdir != ""
      register: vps_monitor_before
      changed_when: false
      failed_when: false

    - name: Check whether PBApiServer was active
      command:
        argv:
          - systemctl
          - --user
          - is-active
          - --quiet
          - pbgui-api.service
      when: pbgdir != ""
      register: api_server_before
      changed_when: false
      failed_when: false

    - name: Recover and verify monitor-agent without touching PBApiServer
      script: setup/vps_service_control.sh start PBMonitorAgent
      environment:
        PBGUI_DIR: "{{ pbgdir }}"
        PBGUI_PYTHON: "{{ pbgui_python | default(ansible_playbook_python) }}"
      when: pbgdir != "" and monitor_agent_before.rc == 0
      register: monitor_agent_recovery
      changed_when: false

    - name: Validate pinned PB7 commit
      assert:
        that:
          - pb7_ref is match('^[0-9a-f]{40}$')
        fail_msg: "pb7_ref.txt must contain one exact lowercase 40-character commit SHA."

    - name: Fetch and verify pinned Passivbot v7
      command:
        argv:
          - python3
          - "{{ pbgdir }}/pb7_guard.py"
          - --repo
          - "{{ pb7dir }}"
          - --ref
          - "{{ pb7_ref }}"
          - --expected-major
          - "7"
          - --fetch-url
          - https://github.com/enarjord/passivbot.git
      register: pb7_preflight
      changed_when: false
      when: pb7dir != ""

    - name: Inspect installed PB7 wheel receipt
      command:
        argv: ["{{ pbgui_python | default(ansible_playbook_python) }}", "{{ pbgdir }}/pb_wheel_status.py", "{{ pbgdir }}", --check-product, pb7, --repo, "{{ pb7dir }}", --python, "{{ pb7venv }}/bin/python"]
      register: pb7_wheel_status
      changed_when: false
      when: pb7dir != ""

    - name: Decide whether PB7 requires an update
      set_fact:
        pb7_update_required: "{{ 'checkout_required=true' in pb7_preflight.stdout or not ((pb7_wheel_status.stdout | from_json).installed | bool) }}"
      when: pb7dir != ""

    - name: Prepare central PB7 wheels before runtime changes
      include_tasks: tasks/pb7_wheels_prepare.yml
      when: pb7dir != "" and pb7_update_required

    - name: Stop PBRun before changing PB7 checkout
      command:
        argv:
          - "{{ pbgui_python | default(ansible_playbook_python) }}"
          - "{{ pbgdir }}/starter.py"
          - --stop
          - PBRun
      changed_when: true
      notify: restart pb7
      when: pb7dir != "" and pb7_update_required

    - name: Stop PB7 processes before changing checkout
      command:
        argv:
          - python3
          - "{{ pbgdir }}/pb7_guard.py"
          - --repo
          - "{{ pb7dir }}"
          - --ref
          - "{{ pb7_ref }}"
          - --expected-major
          - "7"
          - --stop-processes
          - --venv
          - "{{ pb7venv }}"
      changed_when: false
      when: pb7dir != "" and pb7_update_required

    - name: Checkout verified pinned Passivbot v7
      command:
        argv:
          - python3
          - "{{ pbgdir }}/pb7_guard.py"
          - --repo
          - "{{ pb7dir }}"
          - --ref
          - "{{ pb7_ref }}"
          - --expected-major
          - "7"
          - --checkout
      register: pb7_repo
      changed_when: "'checkout_changed=true' in pb7_repo.stdout"
      when: pb7dir != "" and pb7_update_required

    - name: Install and validate central PB7 wheels
      include_tasks: tasks/pb7_wheels_install.yml
      when: pb7dir != "" and pb7_update_required

    - name: Schedule PB7 restart after validated wheel update
      command: /bin/true
      changed_when: true
      notify: restart pb7
      when: pb7dir != "" and pb7_update_required

    - name: print pb7_repo
      debug:
        var: pb7_repo
      tags: debug,never

  handlers:
    - name: Sync PBGui systemd user services
      command:
        argv:
          - /bin/bash
          - "{{ pbgdir }}/setup/setup_systemd.sh"
          - --pbgui-dir
          - "{{ pbgdir }}"
          - --python
          - "{{ pbgui_python | default(ansible_playbook_python) }}"
          - --preserve-state
      register: systemd_setup_result
      changed_when: "'changed=true' in (systemd_setup_result.stdout | default(''))"
      listen: "restart pbgui"

    - name: Restart PBCluster, PBRun, PBData, PBCoinData and PBMonitorAgent
      script: setup/vps_service_control.sh restart PBCluster PBRun PBData PBCoinData PBMonitorAgent
      environment:
        PBGUI_DIR: "{{ pbgdir }}"
        PBGUI_PYTHON: "{{ pbgui_python | default(ansible_playbook_python) }}"
        PBGUI_REQUIRE_PBCOINDATA: "1"
        PBGUI_RESTART_ACTIVE_ONLY: "1"
      listen: "restart pbgui"

    - name: Clean controller PB7 wheel staging
      file:
        path: "{{ pb7_wheel_master_stage.path }}"
        state: absent
      delegate_to: localhost
      when: pb7_wheel_master_stage is defined and pb7_wheel_master_stage.path is defined

    - name: Clean target PB7 wheel staging
      file:
        path: "{{ pb7_wheel_remote_stage.path }}"
        state: absent
      when: pb7_wheel_remote_stage is defined and pb7_wheel_remote_stage.path is defined

    - name: Make sure PBRun ist running
      command:
        argv:
          - "{{ pbgui_python | default(ansible_playbook_python) }}"
          - "{{ pbgdir }}/starter.py"
          - -s
          - PBRun
      args:
        chdir: "{{ pbgdir }}"
      listen: "restart pb7"

    - name: Restart PBApiServer after PB7 handlers complete
      shell: |
        set -euo pipefail
        restart_unit="pbgui-api-restart-$(date +%s%N)"
        systemd-run --user --unit="$restart_unit" --collect --expand-environment=no --setenv=PBGUI_DIR="$PBGUI_DIR" --setenv=PBGUI_PYTHON="$PBGUI_PYTHON" --setenv=PBGUI_VPS_MONITOR_WAS_ACTIVE="$PBGUI_VPS_MONITOR_WAS_ACTIVE" /bin/bash -c '
          sleep 5
          cd "$PBGUI_DIR"
          systemctl --user stop pbgui-api.service >/dev/null 2>&1 || true
          /bin/bash "$PBGUI_DIR/setup/stop_legacy_api.sh" --pbgui-dir "$PBGUI_DIR"
          if [ "$PBGUI_VPS_MONITOR_WAS_ACTIVE" = "1" ]; then
            systemctl --user restart pbgui-vps-monitor.service
            monitor_ready=0
            for _ in $(seq 1 30); do
              if "$PBGUI_PYTHON" -c "from master.vps_monitor_client import VPSMonitorRPCClient; VPSMonitorRPCClient(timeout=1).call(\"hello\")"; then
                monitor_ready=1
                break
              fi
              sleep 1
            done
            if [ "$monitor_ready" != 1 ]; then
              systemctl --user status pbgui-vps-monitor.service --no-pager -l
              exit 1
            fi
          fi
          if ! systemctl --user start pbgui-api.service; then
            systemctl --user show pbgui-api.service --no-pager --property=ActiveState,SubState,Result,ExecMainStatus,NRestarts
            systemctl --user status pbgui-api.service --no-pager -l
            exit 1
          fi
          baseline="$(systemctl --user show pbgui-api.service --property=NRestarts --value)"
          case "$baseline" in ""|*[!0-9]*) baseline=0 ;; esac
          sleep 12
          active="$(systemctl --user show pbgui-api.service --property=ActiveState --value)"
          sub="$(systemctl --user show pbgui-api.service --property=SubState --value)"
          result="$(systemctl --user show pbgui-api.service --property=Result --value)"
          status="$(systemctl --user show pbgui-api.service --property=ExecMainStatus --value)"
          after="$(systemctl --user show pbgui-api.service --property=NRestarts --value)"
          case "$after" in ""|*[!0-9]*) after=0 ;; esac
          if [ "$active" != active ] || [ "$sub" != running ] || [ "$result" != success ] || [ "${status:-0}" != 0 ] || [ "$after" -gt "$baseline" ]; then
            systemctl --user show pbgui-api.service --no-pager --property=ActiveState,SubState,Result,ExecMainStatus,NRestarts
            systemctl --user status pbgui-api.service --no-pager -l
            exit 1
          fi
        '
      args:
        executable: /bin/bash
      environment:
        PBGUI_DIR: "{{ pbgdir }}"
        PBGUI_PYTHON: "{{ pbgui_python | default(ansible_playbook_python) }}"
        PBGUI_VPS_MONITOR_WAS_ACTIVE: "{{ '1' if (vps_monitor_before.rc | default(1)) == 0 else '0' }}"
      changed_when: true
      listen: "restart pbgui"
      when: (api_server_before.rc | default(1)) == 0
