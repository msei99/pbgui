name: PBGui GitHub Telegram Bot

on:
  push:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version to resend (for example v2.0.3)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  notification:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Notify the commit on Telegram
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: '${{ secrets.BOT_TOKEN }}'
          TELEGRAM_CHAT_ID: '${{ secrets.CHAT_ID }}'
          TELEGRAM_TOPIC_ID: '${{ secrets.TOPIC_ID }}'
          GITHUB_TOKEN: '${{ github.token }}'
        run: |
          python3 - <<'PY'
          import base64
          import html
          import json
          import os
          import re
          import time
          from pathlib import Path
          from urllib.error import HTTPError, URLError
          from urllib.parse import quote
          from urllib.request import Request, urlopen


          def escaped(value: object) -> str:
              return html.escape(str(value or ""), quote=True)


          def send_message(payload: dict[str, object]) -> None:
              for attempt in range(3):
                  request = Request(
                      f"https://api.telegram.org/bot{token}/sendMessage",
                      data=json.dumps(payload).encode("utf-8"),
                      headers={"Content-Type": "application/json"},
                      method="POST",
                  )
                  try:
                      with urlopen(request, timeout=15) as response:
                          result = json.loads(response.read().decode("utf-8"))
                  except HTTPError as exc:
                      if exc.code != 429 or attempt == 2:
                          raise SystemExit(f"Telegram notification failed with HTTP {exc.code}") from exc
                      retry_after = 1.0
                      try:
                          error = json.loads(exc.read().decode("utf-8"))
                          retry_after = float((error.get("parameters") or {}).get("retry_after") or 1)
                      except (AttributeError, TypeError, ValueError, json.JSONDecodeError):
                          pass
                      time.sleep(min(max(retry_after, 1.0), 30.0))
                      continue
                  except URLError as exc:
                      raise SystemExit("Telegram notification failed due to a network error") from exc

                  if not result.get("ok"):
                      raise SystemExit("Telegram rejected the notification")
                  return


          def telegram_payload(text: str) -> dict[str, object]:
              payload: dict[str, object] = {
                  "chat_id": chat_id,
                  "text": text,
                  "disable_web_page_preview": True,
              }
              if topic_id:
                  try:
                      payload["message_thread_id"] = int(topic_id)
                  except ValueError as exc:
                      raise SystemExit("Telegram topic ID must be an integer") from exc
              return payload


          def split_message(text: str, limit: int = 3900) -> list[str]:
              chunks = []
              remaining = text.strip()
              while len(remaining) > limit:
                  split_at = remaining.rfind("\n", 0, limit + 1)
                  if split_at <= 0:
                      split_at = limit
                  chunks.append(remaining[:split_at].rstrip())
                  remaining = remaining[split_at:].lstrip("\n")
              if remaining:
                  chunks.append(remaining)
              return chunks


          def release_markdown_html(markdown: str) -> str:
              def inline(value: str) -> str:
                  rendered = escaped(value)
                  rendered = re.sub(r"\*\*([^*\n]+)\*\*", r"<b>\1</b>", rendered)
                  rendered = re.sub(r"`([^`\n]+)`", r"<code>\1</code>", rendered)
                  return rendered

              lines = []
              for raw_line in markdown.splitlines():
                  heading = re.match(r"^#{1,6}\s+(.+)$", raw_line.strip())
                  bullet = re.match(r"^\s*[-*]\s+(.+)$", raw_line)
                  if heading:
                      lines.append(f"<b>{inline(heading.group(1))}</b>")
                  elif bullet:
                      lines.append(f"• {inline(bullet.group(1))}")
                  elif raw_line.startswith("Release notes "):
                      lines.append(f"<b>{inline(raw_line)}</b>")
                  else:
                      lines.append(inline(raw_line))
              return "\n".join(lines)


          def release_notes(version: str, commit_sha: str) -> tuple[str, str]:
              github_token = os.environ.get("GITHUB_TOKEN", "").strip()
              if not github_token:
                  raise SystemExit("GitHub token is not available for loading release notes")

              encoded_path = quote(f"releases/{version}.md", safe="/")
              api_url = (
                  f"https://api.github.com/repos/{repository_name}/contents/{encoded_path}"
                  f"?ref={quote(commit_sha, safe='')}"
              )
              request = Request(
                  api_url,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {github_token}",
                      "User-Agent": "pbgui-release-notifier",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              try:
                  with urlopen(request, timeout=15) as response:
                      result = json.loads(response.read().decode("utf-8"))
              except HTTPError as exc:
                  raise SystemExit(
                      f"Could not load release notes for {version} (GitHub HTTP {exc.code})"
                  ) from exc
              except URLError as exc:
                  raise SystemExit(f"Could not load release notes for {version}") from exc

              content = result.get("content")
              if not isinstance(content, str):
                  raise SystemExit(f"GitHub returned no release notes for {version}")
              try:
                  notes = base64.b64decode(content).decode("utf-8")
              except (ValueError, UnicodeDecodeError) as exc:
                  raise SystemExit(f"Could not decode release notes for {version}") from exc

              notes_lines = notes.strip().splitlines()
              if notes_lines and notes_lines[0].strip() == f"# {version}":
                  notes_lines = notes_lines[1:]
              notes_body = "\n".join(notes_lines).strip()
              notes_url = f"{repository_url}/blob/{commit_sha}/releases/{quote(version)}.md"
              return notes_body, notes_url


          token = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
          chat_id = os.environ.get("TELEGRAM_CHAT_ID", "").strip()
          topic_id = os.environ.get("TELEGRAM_TOPIC_ID", "").strip()
          if not token or not chat_id:
              raise SystemExit("Telegram commit-feed secrets are not configured")

          event_path = Path(os.environ["GITHUB_EVENT_PATH"])
          event = json.loads(event_path.read_text(encoding="utf-8"))
          repository = event.get("repository") or {}
          commits = event.get("commits") or []
          repository_name = repository.get("full_name") or os.environ.get("GITHUB_REPOSITORY", "unknown")
          repository_url = repository.get("html_url") or f"https://github.com/{repository_name}"
          branch = str(event.get("ref") or "").removeprefix("refs/heads/")
          commit_sha = str(event.get("after") or os.environ.get("GITHUB_SHA", ""))
          version_pattern = re.compile(r"v[0-9]+(?:\.[0-9]+){1,2}")
          manual_version = str((event.get("inputs") or {}).get("version") or "").strip()
          if manual_version and not version_pattern.fullmatch(manual_version):
              raise SystemExit("Manual release version is invalid")

          if commits:
              lines = [
                  f"<b>🔨 {len(commits)} new commit(s) to</b> "
                  f"<a href='{escaped(repository_url)}'>{escaped(repository_name)}</a>"
                  f"[<code>{escaped(branch)}</code>]",
                  "",
              ]
              omitted = 0
              for index, commit in enumerate(commits):
                  commit_url = str(commit.get("url") or repository_url)
                  commit_id = str(commit.get("id") or "unknown")[:7]
                  commit_message = " ".join(str(commit.get("message") or "(no message)").split())
                  if len(commit_message) > 500:
                      commit_message = commit_message[:497] + "..."
                  author = commit.get("author") or {}
                  author_name = author.get("name") or author.get("username") or "unknown"
                  username = str(author.get("username") or "").strip()
                  author_url = f"https://github.com/{quote(username, safe='')}" if username else commit_url
                  line = (
                      f"• <a href='{escaped(commit_url)}'>{escaped(commit_id)}</a> - "
                      f"{escaped(commit_message)} by "
                      f"<a href='{escaped(author_url)}'>{escaped(author_name)}</a>"
                  )
                  if len("\n".join(lines + [line])) > 3900:
                      omitted = len(commits) - index
                      break
                  lines.append(line)

              if omitted:
                  lines.extend(["", f"... and {omitted} more commit(s)"])

              payload = telegram_payload("\n".join(lines))
              payload["parse_mode"] = "HTML"

              compare_url = str(event.get("compare") or "").strip()
              if compare_url:
                  payload["reply_markup"] = {
                      "inline_keyboard": [[{"text": "Open Changes", "url": compare_url}]],
                  }

              send_message(payload)

          release_versions = [manual_version] if manual_version else []
          for commit in commits:
              subject = str(commit.get("message") or "").splitlines()[0].strip()
              if subject.startswith("Release "):
                  version = subject.removeprefix("Release ")
                  if version_pattern.fullmatch(version):
                      release_versions.append(version)

          for version in dict.fromkeys(release_versions):
              notes_body, notes_url = release_notes(version, commit_sha)
              text = f"Release notes {version}\n{notes_url}"
              if notes_body:
                  text += f"\n\n{notes_body}"
              for chunk in split_message(text):
                  payload = telegram_payload(release_markdown_html(chunk))
                  payload["parse_mode"] = "HTML"
                  send_message(payload)
          PY
