---
# Legacy entry point: use the controller-built, source-bound PB7 wheel flow.
- hosts: "{{ hostname }}"
  gather_facts: true
  tasks:
    - name: Resolve the legacy PB7 install directory
      set_fact:
        install_dir: "{{ ansible_facts['env']['HOME'] }}/software"
      when: install_dir is not defined

- import_playbook: vps-update-pb7.yml
  vars:
    pb7_recreate_python312: true
